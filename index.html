<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="工作助手">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>工作助手</title>
<style>
:root{
  --bg:#f2f2f7; --card:#fff; --text:#1c1c1e; --muted:#8e8e93; --line:#e4e4e9;
  --accent:#5e5ce6; --danger:#ff3b30; --gold:#ff9500; --ok:#34c759;
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#000;--card:#1c1c1e;--text:#f2f2f7;--muted:#98989d;--line:#2c2c2e;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--text);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  display:flex;flex-direction:column;
  height:100vh;height:100dvh;height:var(--app-h,100dvh);
  overflow:hidden;touch-action:manipulation;
}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.hidden{display:none!important}
input,textarea{font:inherit;color:var(--text)}

/* ---------- 顶栏 ---------- */
.topbar{display:flex;align-items:center;padding:10px 14px 5px}
.topbar h1{font-size:20px;margin:0;flex:1;font-weight:650;letter-spacing:.2px}
.iconbtn{width:38px;height:38px;border-radius:50%;font-size:19px;color:var(--muted);display:grid;place-items:center}
.iconbtn:active{background:var(--line)}
#btnAdd{color:var(--accent);font-size:24px;font-weight:300}

/* ---------- 页面 ---------- */
.page{flex:1;min-height:0;display:flex;flex-direction:column}
.scrollarea{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:14px}

/* 分段控件 */
.seg{display:flex;gap:3px;margin:2px 14px 10px;background:var(--line);border-radius:9px;padding:3px;flex:none}
.seg button{flex:1;padding:7px 0;border-radius:7px;font-size:14px;opacity:.62}
.seg button.on{background:var(--card);opacity:1;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* ---------- 列表 ---------- */
.list{background:var(--card);border-radius:var(--r);margin:0 14px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row:active{background:var(--line)}
.row .body{flex:1;min-width:0}
.row .nm{font-size:15.5px;line-height:1.3;word-break:break-word;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row .sub{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row .sub .over{color:var(--danger)}
.row .sub .soon{color:var(--gold)}
.row.done .nm{text-decoration:line-through;color:var(--muted)}

/* 右侧计数 */
.side{flex:none;text-align:right;line-height:1.35}
.side b{font-size:16px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.side i{font-style:normal;font-size:11px;color:var(--muted)}
.side .t2{display:block;font-size:11px;color:var(--muted)}
.side .t2 b{font-size:12px;color:var(--muted);font-weight:600}

/* 勾选圆 */
.check{width:22px;height:22px;border-radius:50%;border:1.8px solid var(--muted);flex:none;display:grid;place-items:center;transition:background .12s,border-color .12s}
.check.on{background:var(--accent);border-color:var(--accent)}
.check.on::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}

/* 徽章与星级 */
.badge{font-size:10.5px;padding:2px 7px;border-radius:8px;font-weight:600;flex:none}
.stars{color:var(--gold);font-size:11.5px;letter-spacing:1px;flex:none}

/* 空态 */
.empty{padding:60px 30px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.9}
.empty .big{font-size:34px;margin-bottom:10px}
.empty b{color:var(--text);font-weight:600}

/* 分组标题（层级分组） */
.gtitle{font-size:12px;font-weight:700;color:var(--muted);margin:16px 18px 6px;letter-spacing:.4px;display:flex;align-items:center;gap:6px}
.gtitle:first-child{margin-top:8px}
.gtitle .n{font-weight:400}

/* ---------- 底部标签栏 ---------- */
.tabbar{display:flex;flex:none;border-top:1px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{flex:1;padding:9px 0 10px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabbar button .ic{font-size:17px;line-height:1}
.tabbar button.on{color:var(--accent);font-weight:600}

/* ---------- 整屏详情 ---------- */
.screen{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column}
.screen-head{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 10px;border-bottom:1px solid var(--line)}
.screen-head h2{margin:0;font-size:17px;flex:1;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.screen-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:20px}
.back{color:var(--accent);font-size:16px;display:flex;align-items:center;gap:2px;padding:4px 6px 4px 0;flex:none}

/* 详情信息卡 */
.infocard{background:var(--card);border-radius:var(--r);margin:12px 14px;padding:16px}
.infocard .tip{font-size:11px;color:var(--muted);text-align:center;margin-top:12px}
.infocard .big-nm{font-size:19px;font-weight:650;word-break:break-word;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.infocard .meta{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.7}
.infocard .meta .over{color:var(--danger)}
.infocard .note{margin-top:10px;font-size:13.5px;color:var(--text);background:var(--bg);border-radius:10px;padding:10px 12px;line-height:1.6;word-break:break-word}

/* 完成总开关行 */
.master{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:var(--r);margin:0 14px 12px;padding:13px 14px}
.master:active{background:var(--line)}
.master .lb{flex:1;font-size:15px;font-weight:600}
.master .st{font-size:11.5px;color:var(--muted)}

/* ---------- 底部弹层 ---------- */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:flex-end}
.sheet{background:var(--card);width:100%;max-height:92vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:6px 18px calc(env(safe-area-inset-bottom,0px) + 18px)}
.sheet-grip{width:36px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 12px}
.sheet h2{margin:0 0 14px;font-size:17px;font-weight:650}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:500}
.field textarea,.field input[type=text],.field input[type=datetime-local]{
  width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:15px;outline:none
}
@media (prefers-color-scheme:dark){.field textarea,.field input[type=text],.field input[type=datetime-local]{background:#2c2c2e}}
.field textarea{resize:none;min-height:64px;line-height:1.5}
.field textarea:focus,.field input:focus{border-color:var(--accent)}
.chips{display:flex;gap:8px}
.chips.wrap{flex-wrap:wrap}
.chip{flex:1;padding:10px 0;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:13px;color:var(--muted);text-align:center}
@media (prefers-color-scheme:dark){.chip{background:#2c2c2e}}
.chips.wrap .chip{flex:1 1 30%}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.staredit{display:flex;gap:6px}
.staredit button{flex:1;padding:8px 0;font-size:22px;color:var(--line);text-align:center}
.staredit button.on{color:var(--gold)}
.mini{font-size:12px;color:var(--accent);font-weight:600;padding:4px 6px}
.pick-head{display:flex;align-items:center;gap:4px;margin-bottom:6px}
.pick-head label{flex:1;margin:0}
.picklist{max-height:300px;overflow-y:auto;border:1px solid var(--line);border-radius:10px}
.picklist .prow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.picklist .prow:last-child{border-bottom:0}
.picklist .prow:active{background:var(--line)}
.picklist .pnm{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-actions{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;padding:13px 0;border-radius:11px;font-size:15.5px;text-align:center;font-weight:600}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:var(--bg);color:var(--text)}
@media (prefers-color-scheme:dark){.btn.ghost{background:#2c2c2e}}
.btn.danger{background:transparent;color:var(--danger)}
.btn:active{opacity:.75}

/* ---------- 菜单 / 快照 ---------- */
.menu-list{background:var(--card);border-radius:var(--r);overflow:hidden;margin:0 14px}
.menu-list button{display:block;width:100%;text-align:left;padding:15px 16px;font-size:15.5px;border-bottom:1px solid var(--line)}
.menu-list button:last-child{border-bottom:0}
.menu-list button.danger{color:var(--danger)}
.menu-list button:active{background:var(--line)}
.warnbar{background:#ff950022;color:#c86a00;font-size:12.5px;padding:9px 14px;text-align:center;line-height:1.6}
@media (prefers-color-scheme:dark){.warnbar{color:#ffb340}}
.warnbar button{color:inherit;text-decoration:underline;font-weight:700;font-size:12.5px;margin-left:4px}
.warnbar.danger{background:#ff3b3022;color:#d70015}
@media (prefers-color-scheme:dark){.warnbar.danger{color:#ff6961}}
.toast{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 64px);z-index:200;
  background:#1c1c1e;color:#fff;border-radius:12px;padding:13px 14px;display:flex;align-items:center;gap:12px;
  font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
@media (prefers-color-scheme:dark){.toast{background:#2c2c2e}}
.toast .msg{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast button{color:#5e5ce6;font-weight:600;font-size:14px;flex:none}
@media (prefers-color-scheme:dark){.toast button{color:#7d7aff}}
.snap{margin-bottom:10px;padding:12px 14px;background:var(--bg);border-radius:10px}
.snap .t{font-size:13.5px;font-weight:600;margin-bottom:3px}
.snap .d{font-size:11.5px;color:var(--muted);margin-bottom:9px}
.snap button{font-size:13px;color:var(--accent);font-weight:600}
.hint{font-size:11.5px;color:var(--muted);line-height:1.7;margin-top:10px}
</style>
</head>
<body>

<div class="topbar">
  <h1 id="pageTitle">客户</h1>
  <button class="iconbtn" id="btnAdd" aria-label="新建">＋</button>
  <button class="iconbtn" id="btnMenu" aria-label="数据管理">⋯</button>
</div>

<div id="storeWarn" class="warnbar hidden"></div>

<div id="pageClients" class="page">
  <div class="scrollarea" id="clientList"></div>
</div>

<div id="pageTasks" class="page hidden">
  <div class="seg" id="taskSeg">
    <button data-v="0" class="on">未完成</button>
    <button data-v="1">已完成</button>
  </div>
  <div class="scrollarea" id="taskList"></div>
</div>

<div class="tabbar">
  <button id="tabClients" class="on"><span class="ic">▦</span>客户</button>
  <button id="tabTasks"><span class="ic">✓</span>任务</button>
</div>

<div id="detailScreen" class="screen hidden">
  <div class="screen-head">
    <button class="back" id="btnBack">‹ 返回</button>
    <h2 id="detailTitle"></h2>
    <button class="iconbtn hidden" id="btnDetailAdd" aria-label="关联任务">＋</button>
  </div>
  <div class="screen-body" id="detailBody"></div>
</div>

<div id="mask" class="mask hidden">
  <div class="sheet">
    <div class="sheet-grip"></div>
    <div id="sheetBox"></div>
  </div>
</div>

<div id="toast" class="toast hidden">
  <div class="msg"></div>
  <button id="toastBtn"></button>
</div>

<input type="file" id="fileInput" accept="application/json,.json" class="hidden">

<script>
'use strict';

/* ============ 常量 ============ */
var KEY = 'work.assistant.v1';
var SNAP_KEY = 'work.assistant.snapshots';
var SNAP_META = 'work.assistant.snapmeta';
var CORRUPT_KEY = 'work.assistant.corrupt';
var SNAP_MAX = 3;
var DAY = 86400000;
var INF = 9007199254740991;

/* 层级：顺序即排序顺序，最上面的最高 */
var TIERS = [
  { k:'seed',  n:'金种子',  c:'#a07d00', bg:'#ffd60a33' },
  { k:'t360',  n:'top360',  c:'#ff3b30', bg:'#ff3b3022' },
  { k:'t1000', n:'top1000', c:'#e08400', bg:'#ff950022' },
  { k:'t1500', n:'top1500', c:'#0a84ff', bg:'#0a84ff22' },
  { k:'ndka',  n:'NDKA+',   c:'#8e8e93', bg:'#8e8e9322' }
];
var CHANNELS = [
  { k:'fd',   n:'FD渠道' },
  { k:'exp',  n:'体验店渠道' },
  { k:'both', n:'FD+体验店' }
];

var db = { version:1, clients:[], tasks:[] };
var storageOK = true, saveFailed = false, corruptRaw = null;
var loadFailed = false;

/* 界面状态 */
var curTab = 'clients';      // clients | tasks
var taskShowDone = 0;        // 0 未完成 1 已完成
var navStack = [];           // [{type:'client'|'task', id}]
var toastTimer = null;
var lastDeleted = null;      // {kind, obj}

/* ============ 工具 ============ */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function p2(n){ return (n<10?'0':'')+n; }
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function $(id){ return document.getElementById(id); }
function mmdd(ts){ var d=new Date(ts); return (d.getMonth()+1)+'/'+d.getDate(); }
function toDateInput(ts){ var d=new Date(ts); return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }
function toLocalInput(ts){ var d=new Date(ts); return toDateInput(ts)+'T'+p2(d.getHours())+':'+p2(d.getMinutes()); }
function fmtDateTime(ts){
  var d=new Date(ts);
  return d.getFullYear()+'/'+p2(d.getMonth()+1)+'/'+p2(d.getDate())+' '+p2(d.getHours())+':'+p2(d.getMinutes());
}
function clampStars(n){ n = parseInt(n,10)||3; return Math.max(1, Math.min(5, n)); }
function starsText(n){ n = clampStars(n); var s=''; for(var i=1;i<=5;i++) s += (i<=n?'★':'☆'); return s; }

function tierOf(c){
  for(var i=0;i<TIERS.length;i++) if(TIERS[i].k===c.tier) return TIERS[i];
  return TIERS[TIERS.length-1];
}
function tierIdx(c){
  for(var i=0;i<TIERS.length;i++) if(TIERS[i].k===c.tier) return i;
  return TIERS.length;
}
function channelOf(c){
  for(var i=0;i<CHANNELS.length;i++) if(CHANNELS[i].k===c.channel) return CHANNELS[i];
  return CHANNELS[0];
}

/* 倒计时文案 */
function countdown(ms){
  var m = Math.floor(ms/60000);
  if(m < 1) return '不到 1 分钟';
  if(m < 60) return m + ' 分钟';
  var h = Math.floor(m/60);
  if(h < 24) return h + ' 小时';
  var d = Math.floor(h/24), rh = h%24;
  return d + ' 天' + (rh ? ' '+rh+' 小时' : '');
}
/* 截止日期走精确时刻，不走凌晨 4 点 */
function dayLabel(ts){
  var d = new Date(ts), now = new Date();
  var a = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  var b = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  if(a === b) return '今天';
  if(a === b + DAY) return '明天';
  return mmdd(ts);
}

/* ============ 存储 ============ */
function warn(msg, danger){
  var el = $('storeWarn');
  el.innerHTML = msg;
  el.classList.toggle('danger', !!danger);
  el.classList.remove('hidden');
}
function warnCorrupt(){
  warn('⚠️ 本地数据读取失败，已用空数据启动。<b>原始内容已保留</b>，可下载后排查。' +
    '<button id="btnCorruptDl">下载原始数据</button><button id="btnCorruptClear">知道了</button>', true);
  $('btnCorruptDl').onclick = function(){
    download('工作助手-损坏数据-'+toDateInput(Date.now())+'.txt', corruptRaw || '', 'text/plain');
  };
  $('btnCorruptClear').onclick = function(){
    try{ localStorage.removeItem(CORRUPT_KEY); }catch(e){}
    corruptRaw = null;
    $('storeWarn').classList.add('hidden');
  };
}
function load(){
  var raw = null, parseFailed = false;
  try{ raw = localStorage.getItem(KEY); }catch(e){ storageOK = false; }
  if(!storageOK){
    try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); storageOK = true; }
    catch(e){ storageOK = false; }
    if(!storageOK) warn('⚠️ 本浏览器不允许本地存储，数据在关闭页面后会丢失。请定期导出备份。', true);
  }
  if(raw){
    try{
      var o = JSON.parse(raw);
      if(o && Array.isArray(o.clients) && Array.isArray(o.tasks)) db = o;
      else parseFailed = true;
    }catch(e){ parseFailed = true; }
    if(parseFailed){
      corruptRaw = raw;
      loadFailed = true;
      try{ localStorage.setItem(CORRUPT_KEY, raw); }catch(e){}
      warnCorrupt();
    }
  }
  if(!parseFailed && !corruptRaw){
    try{
      var kept = localStorage.getItem(CORRUPT_KEY);
      if(kept){ corruptRaw = kept; warnCorrupt(); }
    }catch(e){}
  }
}
function save(){
  if(!storageOK) return;
  try{
    localStorage.setItem(KEY, JSON.stringify(db));
    saveFailed = false;
  }catch(e){
    if(!saveFailed){
      saveFailed = true;
      warn('⚠️ 保存失败，浏览器存储空间可能已满。<b>请立即导出备份</b>，否则新数据会丢。', true);
    }
  }
}
/* 每天首次打开留一份快照，最多 3 份。损坏空表启动时绝不写快照。 */
function snapshot(){
  if(!storageOK || saveFailed || loadFailed) return;
  try{
    var today = toDateInput(Date.now());
    if(localStorage.getItem(SNAP_META) === today) return;
    var list = readSnapshots();
    list.push({ at:Date.now(), clients:db.clients, tasks:db.tasks });
    if(list.length > SNAP_MAX) list = list.slice(-SNAP_MAX);
    localStorage.setItem(SNAP_KEY, JSON.stringify(list));
    localStorage.setItem(SNAP_META, today);
  }catch(e){ /* 空间不足就跳过，主数据已经安全 */ }
}
function readSnapshots(){
  try{
    var v = JSON.parse(localStorage.getItem(SNAP_KEY) || '[]');
    return Array.isArray(v) ? v : [];
  }catch(e){ return []; }
}
function pushSnapshot(){
  try{
    var l = readSnapshots();
    l.push({ at:Date.now(), clients:db.clients, tasks:db.tasks });
    if(l.length > SNAP_MAX) l = l.slice(-SNAP_MAX);
    localStorage.setItem(SNAP_KEY, JSON.stringify(l));
  }catch(e){}
}

/* id 规范化：会拼进 HTML 属性，必须是安全形状 */
function normalizeIds(){
  var map = {}, seen = {};
  function fix(arr){
    (arr||[]).forEach(function(t){
      if(!t) return;
      var raw = (typeof t.id==='string'||typeof t.id==='number') ? String(t.id) : '';
      if(raw && /^[A-Za-z0-9_-]{1,64}$/.test(raw) && !seen[raw]){
        seen[raw]=1; if(raw!==t.id) t.id=raw;
      }else{
        var nid = uid(); seen[nid]=1;
        if(raw) map[raw]=nid;
        t.id = nid;
      }
    });
  }
  fix(db.clients); fix(db.tasks);
  db.tasks.forEach(function(t){
    (t.links||[]).forEach(function(l){ if(l && map[l.clientId]) l.clientId = map[l.clientId]; });
  });
}

/* 导入前校验与归一化 */
function normalizeImport(o){
  if(!o || !Array.isArray(o.clients) || !Array.isArray(o.tasks))
    throw new Error('缺少 clients/tasks 数组 —— 可能不是本应用的备份文件');
  var out = { version:1, clients:[], tasks:[] };
  o.clients.forEach(function(c){
    if(!c || typeof c!=='object' || typeof c.name!=='string') return;
    out.clients.push({
      id: c.id,
      name: c.name,
      tier: typeof c.tier==='string' ? c.tier : 'ndka',
      channel: (c.channel==='fd'||c.channel==='exp'||c.channel==='both') ? c.channel : 'fd',
      stars: clampStars(c.stars),
      note: typeof c.note==='string' ? c.note : '',
      createdAt: typeof c.createdAt==='number' ? c.createdAt : Date.now(),
      deleted: !!c.deleted
    });
  });
  o.tasks.forEach(function(t){
    if(!t || typeof t!=='object' || typeof t.name!=='string') return;
    out.tasks.push({
      id: t.id,
      name: t.name,
      stars: clampStars(t.stars),
      dueAt: typeof t.dueAt==='number' ? t.dueAt : null,
      createdAt: typeof t.createdAt==='number' ? t.createdAt : Date.now(),
      doneAt: typeof t.doneAt==='number' ? t.doneAt : null,
      deleted: !!t.deleted,
      links: Array.isArray(t.links) ? t.links.filter(function(l){
        return l && typeof l.clientId==='string';
      }).map(function(l){
        return { clientId:l.clientId, done:!!l.done, doneAt:typeof l.doneAt==='number'?l.doneAt:null };
      }) : []
    });
  });
  /* 清掉指向不存在客户的关联 */
  var cids = {};
  out.clients.forEach(function(c){ cids[c.id]=1; });
  out.tasks.forEach(function(t){
    t.links = t.links.filter(function(l){ return cids[l.clientId]; });
  });
  return out;
}

function download(filename, text, mime){
  var blob = new Blob([text], { type: mime || 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* ============ 领域逻辑 ============ */
function activeClients(){ return db.clients.filter(function(c){ return !c.deleted; }); }
function activeTasks(){ return db.tasks.filter(function(t){ return !t.deleted; }); }
function clientById(id){
  for(var i=0;i<db.clients.length;i++) if(db.clients[i].id===id) return db.clients[i];
  return null;
}
function taskById(id){
  for(var i=0;i<db.tasks.length;i++) if(db.tasks[i].id===id) return db.tasks[i];
  return null;
}
/* 任务的关联里，指向已删除客户的不参与计数 */
function activeLinks(t){
  return (t.links||[]).filter(function(l){
    var c = clientById(l.clientId);
    return c && !c.deleted;
  });
}
/* 任务完成 = 所有关联客户都勾完；无关联时看自身 doneAt */
function taskDone(t){
  var ls = activeLinks(t);
  return ls.length ? ls.every(function(l){ return l.done; }) : !!t.doneAt;
}
function taskLinkStats(t){
  var ls = activeLinks(t);
  var undone = ls.filter(function(l){ return !l.done; }).length;
  return { total: ls.length, undone: undone };
}
/* 客户视角：该客户关联的任务统计 */
function clientTaskStats(c){
  var ts = activeTasks().filter(function(t){
    return activeLinks(t).some(function(l){ return l.clientId===c.id; });
  });
  var undone = ts.filter(function(t){ return !taskDone(t); }).length;
  return { total: ts.length, undone: undone };
}
function isOverdue(t){ return !taskDone(t) && !!t.dueAt && t.dueAt < Date.now(); }

function dueInfo(t){
  if(!t.dueAt) return null;
  var d = new Date(t.dueAt);
  var hm = p2(d.getHours())+':'+p2(d.getMinutes());
  var diff = t.dueAt - Date.now();
  if(taskDone(t)) return { text:'⏰ '+dayLabel(t.dueAt)+' '+hm, cls:'' };
  if(diff < 0) return { text:'⏰ 已逾期 '+countdown(-diff), cls:'over' };
  return { text:'⏰ '+dayLabel(t.dueAt)+' '+hm+' · 还剩 '+countdown(diff), cls:(diff<DAY?'soon':'') };
}

/* 排序：客户 = 层级顺序 → 星级高 → 创建早 */
function sortedClients(){
  return activeClients().slice().sort(function(a,b){
    return tierIdx(a)-tierIdx(b) || b.stars-a.stars || a.createdAt-b.createdAt;
  });
}
/* 排序：任务未完成 = 截止早(无截止沉底) → 星级高 → 创建早；已完成 = 完成晚 */
function sortedTasks(done){
  var list = activeTasks().filter(function(t){ return taskDone(t)===done; });
  if(done) return list.sort(function(a,b){ return (b.doneAt||0)-(a.doneAt||0); });
  return list.sort(function(a,b){
    return (a.dueAt||INF)-(b.dueAt||INF) || b.stars-a.stars || a.createdAt-b.createdAt;
  });
}

/* ============ 完成状态切换 ============ */
function toggleLink(t, clientId){
  if(!t) return;
  var l = (t.links||[]).find(function(l){ return l.clientId===clientId; });
  if(!l) return;
  l.done = !l.done;
  l.doneAt = l.done ? Date.now() : null;
  /* 全部勾完 → 任务自动完成；任何一个取消 → 任务回到未完成 */
  t.doneAt = taskDone(t) ? Date.now() : null;
  save(); render();
}
function toggleTaskDone(t){
  if(!t) return;
  var now = Date.now();
  if(taskDone(t)){
    activeLinks(t).forEach(function(l){ l.done=false; l.doneAt=null; });
    t.doneAt = null;
  }else{
    activeLinks(t).forEach(function(l){ l.done=true; l.doneAt=now; });
    t.doneAt = now;
  }
  save(); render();
}

/* 星级编辑控件：返回当前值的读写器 */
function wireStars(containerId, initial){
  var val = clampStars(initial);
  var box = $(containerId);
  function paint(){
    box.querySelectorAll('button').forEach(function(b){
      b.classList.toggle('on', parseInt(b.getAttribute('data-s'),10) <= val);
    });
  }
  box.querySelectorAll('button').forEach(function(b){
    b.onclick = function(){ val = parseInt(b.getAttribute('data-s'),10); paint(); };
  });
  paint();
  return { get:function(){ return val; } };
}
function starsEditHTML(){
  var h = '<div class="staredit">';
  for(var i=1;i<=5;i++) h += '<button type="button" data-s="'+i+'">★</button>';
  return h + '</div>';
}
/* 单选 chips */
function wireChips(containerId, initial){
  var val = initial;
  var box = $(containerId);
  function paint(){
    box.querySelectorAll('.chip').forEach(function(c){
      c.classList.toggle('on', c.getAttribute('data-v')===val);
    });
  }
  box.querySelectorAll('.chip').forEach(function(c){
    c.onclick = function(){ val = c.getAttribute('data-v'); paint(); };
  });
  paint();
  return { get:function(){ return val; } };
}

      });
      Object.keys(pickSet).forEach(function(cid){
        if(!keep[cid]) t.links.push({ clientId:cid, done:false, doneAt:null });
      });
      t.doneAt = taskDone(t) ? (t.doneAt||Date.now()) : null;
    }else{
      var nt = {
        id: uid(), name: name, stars: stars.get(), dueAt: dueAt,
        createdAt: Date.now(), doneAt: null, deleted: false,
        links: Object.keys(pickSet).map(function(cid){
          return { clientId:cid, done:false, doneAt:null };
        })
      };
      db.tasks.push(nt);
    }
    save(); closeSheet(); render();
  };
  if(t) $('eDelete').onclick = function(){
    t.deleted = true;
    lastDeleted = { kind:'task', obj:t };
    save(); closeSheet(); render();
    showToast('已删除「'+t.name+'」', '撤销', function(){
      t.deleted = false; save(); render();
    });
  };
}

/* ============ 客户详情：关联任务选择器 ============ */
function openLinkPicker(clientId){
  var c = clientById(clientId);
  if(!c) return;
  var candidates = activeTasks().filter(function(t){
    return !activeLinks(t).some(function(l){ return l.clientId===clientId; });
  }).sort(function(a,b){ return (a.dueAt||INF)-(b.dueAt||INF) || b.stars-a.stars; });

  openSheet('<h2>给「'+esc(c.name)+'」关联任务</h2><div id="linkBox"></div>');
  var box = $('linkBox');
  if(!candidates.length){
    box.innerHTML = '<div class="empty" style="padding:26px">没有可关联的任务<br>先在「任务」页创建任务</div>'
      + '<div class="sheet-actions"><button class="btn ghost" id="lkClose">关闭</button></div>';
    $('lkClose').onclick = closeSheet;
    return;
  }
  box.innerHTML = '<div class="picklist" style="max-height:50vh">' + candidates.map(function(t){
    var st = taskLinkStats(t);
    return '<div class="prow" data-tid="'+t.id+'">'
      + '<span class="pnm">'+esc(t.name)+'</span>'
      + '<span class="stars">'+starsText(t.stars)+'</span>'
      + '<span style="font-size:11px;color:var(--muted)">'+st.undone+'/'+st.total+'</span>'
      + '</div>';
  }).join('') + '</div>'
  + '<div class="sheet-actions"><button class="btn ghost" id="lkClose">关闭</button></div>';
  $('lkClose').onclick = closeSheet;
  box.querySelectorAll('.prow').forEach(function(r){
    r.onclick = function(){
      var t = taskById(r.getAttribute('data-tid'));
      if(t){
        t.links.push({ clientId:clientId, done:false, doneAt:null });
        t.doneAt = null;
        save();
      }
      closeSheet(); render();
      showToast('已关联「'+(t?t.name:'')+'」', null, null);
    };
  });
}

/* ============ 菜单 / 备份 ============ */
function openMenu(){
  openSheet(
    '<h2>数据管理</h2>'
    + '<div class="menu-list" style="margin:0">'
    + '<button id="mExport">导出备份（JSON）</button>'
    + '<button id="mImport">导入备份</button>'
    + '<button id="mSnap">从自动快照恢复</button>'
    + '</div>'
    + '<div class="hint">数据只保存在本浏览器 localStorage，不上传任何服务器。<br>'
    + '每天首次打开会自动留一份快照（保留 3 份）。<b>建议每周导出一次备份</b>：清理浏览器数据、换手机都会丢数据。</div>'
    + '<div class="sheet-actions"><button class="btn ghost" id="mClose">关闭</button></div>'
  );
  $('mClose').onclick = closeSheet;
  $('mExport').onclick = function(){
    download('工作助手-备份-'+toDateInput(Date.now())+'.json', JSON.stringify(db, null, 2));
    closeSheet();
  };
  $('mImport').onclick = function(){ $('fileInput').click(); };
  $('mSnap').onclick = openSnapSheet;
}
function openSnapSheet(){
  var list = readSnapshots();
  if(!list.length){
    openSheet('<h2>自动快照</h2><div class="empty" style="padding:26px">还没有快照<br>每天首次打开会自动留一份</div>'
      + '<div class="sheet-actions"><button class="btn ghost" onclick="document.getElementById(\'mask\').classList.add(\'hidden\')">关闭</button></div>');
    return;
  }
  var html = '<h2>从自动快照恢复</h2>';
  list.slice().reverse().forEach(function(s, i){
    var idx = list.length-1-i;
    html += '<div class="snap"><div class="t">'+fmtDateTime(s.at)+'</div>'
      + '<div class="d">客户 '+((s.clients||[]).length)+' · 任务 '+((s.tasks||[]).length)+'</div>'
      + '<button data-i="'+idx+'">恢复这份（当前数据会先存为快照）</button></div>';
  });
  html += '<div class="sheet-actions"><button class="btn ghost" id="snClose">关闭</button></div>';
  openSheet(html);
  $('snClose').onclick = closeSheet;
  $('sheetBox').querySelectorAll('.snap button').forEach(function(b){
    b.onclick = function(){
      var s = readSnapshots()[parseInt(b.getAttribute('data-i'),10)];
      if(!s) return;
      pushSnapshot();
      db = { version:1, clients:s.clients||[], tasks:s.tasks||[] };
      normalizeIds();
      save(); closeSheet(); render();
      showToast('已恢复快照', null, null);
    };
  });
}
$('fileInput').addEventListener('change', function(e){
  var f = e.target.files[0];
  e.target.value = '';
  if(!f) return;
  var r = new FileReader();
  r.onload = function(){
    try{
      var o = JSON.parse(r.result);
      var nd = normalizeImport(o);
      pushSnapshot();
      db = nd;
      normalizeIds();
      save(); closeSheet(); render();
      showToast('导入成功（导入前的数据已存为快照）', null, null);
    }catch(err){
      showToast('导入失败：'+err.message, null, null);
    }
  };
  r.readAsText(f);
});

/* ============ Toast ============ */
function showToast(msg, actionLabel, onAction){
  var t = $('toast');
  t.querySelector('.msg').textContent = msg;
  var btn = $('toastBtn');
  if(actionLabel){
    btn.textContent = actionLabel;
    btn.classList.remove('hidden');
    btn.onclick = function(){ hideToast(); if(onAction) onAction(); };
  }else{
    btn.classList.add('hidden');
  }
  t.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, 6000);
}
function hideToast(){ $('toast').classList.add('hidden'); clearTimeout(toastTimer); }

/* ============ 标签页 / 顶栏 ============ */
function switchTab(tab){
  curTab = tab;
  $('pageClients').classList.toggle('hidden', tab!=='clients');
  $('pageTasks').classList.toggle('hidden', tab!=='tasks');
  $('tabClients').classList.toggle('on', tab==='clients');
  $('tabTasks').classList.toggle('on', tab==='tasks');
  $('pageTitle').textContent = tab==='clients' ? '客户' : '任务';
}
$('tabClients').onclick = function(){ switchTab('clients'); };
$('tabTasks').onclick = function(){ switchTab('tasks'); };
$('taskSeg').querySelectorAll('button').forEach(function(b){
  b.onclick = function(){
    taskShowDone = parseInt(b.getAttribute('data-v'),10);
    $('taskSeg').querySelectorAll('button').forEach(function(x){ x.classList.toggle('on', x===b); });
    renderTasks();
  };
});
$('btnAdd').onclick = function(){
  if(curTab==='clients') openClientEditor(null);
  else openTaskEditor(null);
};
$('btnMenu').onclick = openMenu;
$('btnBack').onclick = function(){
  navStack.pop();
  if(!navStack.length) $('detailScreen').classList.add('hidden');
  else {
    var top = navStack[navStack.length-1];
    $('btnDetailAdd').classList.toggle('hidden', top.type!=='client');
    renderDetail();
  }
};
$('btnDetailAdd').onclick = function(){
  var top = navStack[navStack.length-1];
  if(top && top.type==='client') openLinkPicker(top.id);
};

/* ============ 启动 ============ */
function setAppHeight(){
  document.documentElement.style.setProperty('--app-h', window.innerHeight + 'px');
}
window.addEventListener('resize', setAppHeight);

load();
normalizeIds();
save();
snapshot();
setAppHeight();
render();

document.addEventListener('visibilitychange', function(){
  if(!document.hidden) render();
});
setInterval(render, 60000);   // 每分钟刷一次倒计时

if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).catch(function(){});
  });
}
</script>
