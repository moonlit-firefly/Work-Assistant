<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="工作助手">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>工作助手</title>
<style>
:root{
  --bg:#f2f2f7; --card:#fff; --text:#1c1c1e; --muted:#8e8e93; --line:#e4e4e9;
  --accent:#5e5ce6; --danger:#ff3b30; --gold:#ff9500; --ok:#34c759;
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#000;--card:#1c1c1e;--text:#f2f2f7;--muted:#98989d;--line:#2c2c2e;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--text);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  display:flex;flex-direction:column;
  height:100vh;height:100dvh;height:var(--app-h,100dvh);
  overflow:hidden;touch-action:manipulation;
}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.hidden{display:none!important}
input,textarea,select{font:inherit;color:var(--text)}

/* ---------- 顶栏 ---------- */
.topbar{display:flex;align-items:center;padding:10px 14px 5px;gap:2px}
.topbar h1{font-size:20px;margin:0;flex:1;font-weight:650;letter-spacing:.2px}
.iconbtn{width:38px;height:38px;border-radius:50%;font-size:18px;color:var(--muted);display:grid;place-items:center;flex:none}
.iconbtn:active{background:var(--line)}
#btnAdd{color:var(--accent);font-size:24px;font-weight:300}

/* ---------- 页面 ---------- */
.page{flex:1;min-height:0;display:flex;flex-direction:column}
.scrollarea{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:14px}

/* 分段控件 */
.seg{display:flex;gap:3px;margin:2px 14px 10px;background:var(--line);border-radius:9px;padding:3px;flex:none}
.seg button{flex:1;padding:7px 0;border-radius:7px;font-size:14px;opacity:.62}
.seg button.on{background:var(--card);opacity:1;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* 周条（跟随内容滚动，不再冻结在顶部） */
.wbar{margin:4px 14px 12px;background:linear-gradient(135deg,#5e5ce6,#8a7bff);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px;flex:none;color:#fff}
.wbar.alt{background:var(--card);color:var(--text)}
.wbar .wnum{font-size:24px;font-weight:800;letter-spacing:.4px;line-height:1;flex:none}
.wbar .wmeta{display:flex;flex-direction:column;gap:3px;min-width:0}
.wbar .rng{font-size:11px;opacity:.85;white-space:nowrap}
.wbar .tag{font-size:10px;padding:2px 8px;border-radius:8px;background:rgba(255,255,255,.25);color:#fff;font-weight:600;width:max-content}
.wbar.alt .tag{background:var(--line);color:var(--muted)}
.wbar .wstats{margin-left:auto;text-align:right;flex:none}
.wbar .wstats b{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums}
.wbar .wstats span{font-size:12px;opacity:.8}
.wbar .wstats i{display:block;font-style:normal;font-size:10px;opacity:.75;margin-top:1px}
.wbar .back{font-size:12px;background:rgba(255,255,255,.22);color:#fff;font-weight:600;padding:7px 11px;border-radius:9px;flex:none}
.wbar.alt .back{background:var(--accent)}

/* ---------- 列表 ---------- */
.list{background:var(--card);border-radius:var(--r);margin:0 14px;overflow:hidden}
.list.flat{margin:0}
.row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row:active{background:var(--line)}
.row .body{flex:1;min-width:0}
.row .nm{font-size:15.5px;line-height:1.3;word-break:break-word;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row .sub{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row .sub .over{color:var(--danger)}
.row .sub .soon{color:var(--gold)}
.row.done .nm{text-decoration:line-through;color:var(--muted)}
.row.pinned{background:var(--accent)}
.row.pinned .nm,.row.pinned .big{color:#fff}
.row.pinned .sub{color:#ffffffcc}
.row.pinned:active{background:var(--accent)}
.row .big{font-size:15.5px;font-weight:650;color:var(--text)}

/* 右侧计数 */
.side{flex:none;text-align:right;line-height:1.35}
.side b{font-size:16px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.side i{font-style:normal;font-size:11px;color:var(--muted)}
.side .t2{display:block;font-size:11px;color:var(--muted)}
.side .t2 b{font-size:12px;color:var(--muted);font-weight:600}
.row.pinned .side b,.row.pinned .side i{color:#fff}

/* 勾选圆 */
.check{width:22px;height:22px;border-radius:50%;border:1.8px solid var(--muted);flex:none;display:grid;place-items:center;transition:background .12s,border-color .12s}
.check.on{background:var(--accent);border-color:var(--accent)}
.check.on::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.row.pinned .check{border-color:#fff}
.row.pinned .check.on{background:#fff}
.row.pinned .check.on::after{border-color:var(--accent)}

/* 行内小圆点（提单） */
.dots{display:flex;gap:6px;flex:none;align-items:center}
.dot{height:24px;padding:0 9px;border-radius:12px;border:1.4px solid var(--line);display:grid;place-items:center;font-size:10.5px;color:var(--muted);line-height:1}
.dot.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}

/* 徽章与星级 */
.badge{font-size:10.5px;padding:2px 7px;border-radius:8px;font-weight:600;flex:none}
.stars{color:var(--gold);font-size:11.5px;letter-spacing:1px;flex:none}
.stars.lg{font-size:15px}

/* 空态 */
.empty{padding:56px 30px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.9}
.empty .big{font-size:34px;margin-bottom:10px}
.empty b{color:var(--text);font-weight:600}
.sec-title{font-size:12px;font-weight:700;color:var(--muted);margin:16px 18px 7px;letter-spacing:.4px;display:flex;align-items:center;gap:6px}
.sec-title:first-child{margin-top:8px}
.sec-title .n{font-weight:400}
.hint{font-size:11.5px;color:var(--muted);line-height:1.7;margin:10px 18px 0}
.warnline{background:#ff950022;color:#c86a00;font-size:12px;padding:9px 14px;line-height:1.6}
@media (prefers-color-scheme:dark){.warnline{color:#ffb340}}
.gap{height:12px}

/* ---------- 底部标签栏 ---------- */
.tabbar{display:flex;flex:none;border-top:1px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{flex:1;padding:9px 0 10px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabbar button .ic{font-size:17px;line-height:1}
.tabbar button.on{color:var(--accent);font-weight:600}

/* ---------- 整屏详情 ---------- */
.screen{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column}
/* 顶部不叠加 safe-area：独立窗口下系统已为状态栏预留空间，
   再叠一次就会出现一条空白带（同待办应用踩过的坑） */
.screen-head{display:flex;align-items:center;gap:8px;padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.screen-head h2{margin:0;font-size:17px;flex:1;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.screen-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:20px}
.back{color:var(--accent);font-size:16px;display:flex;align-items:center;gap:2px;padding:4px 6px 4px 0;flex:none}

/* 返回浮窗（二级页面右下角，半透明） */
.fabback{position:absolute;right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);width:48px;height:48px;border-radius:50%;
  background:rgba(94,92,230,.72);color:#fff;font-size:28px;font-weight:300;display:grid;place-items:center;
  box-shadow:0 4px 16px rgba(0,0,0,.28);z-index:60;transition:transform .1s}
.fabback:active{transform:scale(.9)}

/* 映射右侧的本周规划文字 */
.mnote{flex:1;min-width:0;text-align:right;font-size:11.5px;color:var(--muted);line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal;padding-left:6px}

/* 详情信息卡 */
.infocard{background:var(--card);border-radius:var(--r);margin:12px 14px;padding:16px}
.infocard .tip{font-size:11px;color:var(--muted);text-align:center;margin-top:12px}
.infocard .big-nm{font-size:19px;font-weight:650;word-break:break-word;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.infocard .meta{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.7}
.infocard .meta .over{color:var(--danger)}
.infocard .note{margin-top:10px;font-size:13.5px;color:var(--text);background:var(--bg);border-radius:10px;padding:10px 12px;line-height:1.6;word-break:break-word}
.infocard .kv{display:flex;font-size:13.5px;padding:6px 0;border-bottom:1px solid var(--line)}
.infocard .kv:last-of-type{border-bottom:0}
.infocard .kv .k{width:82px;flex:none;color:var(--muted);font-size:12.5px}
.infocard .kv .v{flex:1;min-width:0;word-break:break-word}

/* 汇总条 */
.sum{background:var(--card);border-radius:var(--r);margin:12px 14px;padding:13px 14px;display:flex;gap:16px;flex-wrap:wrap}
.sum .it .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.sum .it .k{font-size:11px;color:var(--muted);margin-top:2px}
.sum .it .v.acc{color:var(--accent)}
.sum .it .v.gold{color:var(--gold)}

/* 完成总开关行 */
.master{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:var(--r);margin:0 14px 12px;padding:13px 14px}
.master:active{background:var(--line)}
.master .lb{flex:1;font-size:15px;font-weight:600}
.master .st{font-size:11.5px;color:var(--muted)}

/* 业务入口卡 */
.cards{display:grid;gap:10px;margin:0 14px}
.bizcard{background:var(--card);border-radius:var(--r);padding:14px;display:flex;align-items:center;gap:12px}
.bizcard:active{background:var(--line)}
.bizcard .ic{font-size:20px;width:40px;height:40px;border-radius:11px;background:var(--bg);display:grid;place-items:center;flex:none}
.bizcard .tt{flex:1;min-width:0}
.bizcard .tt b{font-size:15.5px;display:block;font-weight:650}
.bizcard .tt span{font-size:11.5px;color:var(--muted);display:block;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bizcard .nums{text-align:right;font-size:11px;color:var(--muted);line-height:1.6;flex:none}
.bizcard .nums b{color:var(--accent);font-size:14px;font-variant-numeric:tabular-nums}

/* 拖动排序 */
.drag{width:24px;flex:none;text-align:center;color:var(--muted);font-size:16px;touch-action:none;cursor:grab;padding:2px 0}
.row.dragging{opacity:.45;background:var(--line)}

/* 行内操作按钮 / 长文本截断 */
.addbtn{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-size:17px;line-height:1;display:grid;place-items:center;flex:none;font-weight:300}
.addbtn:active{opacity:.7}
.xbtn{width:26px;height:26px;border-radius:50%;color:var(--muted);font-size:17px;display:grid;place-items:center;flex:none}
.xbtn:active{background:var(--line)}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal}

/* ---------- 底部弹层 ---------- */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:flex-end}
.sheet{background:var(--card);width:100%;max-height:92vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:6px 18px calc(env(safe-area-inset-bottom,0px) + 18px)}
.sheet-grip{width:36px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 12px}
.sheet h2{margin:0 0 14px;font-size:17px;font-weight:650}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:500}
.field textarea,.field input[type=text],.field input[type=tel],.field input[type=number],.field input[type=date],.field input[type=datetime-local],.field select{
  width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:15px;outline:none
}
@media (prefers-color-scheme:dark){.field textarea,.field input,.field select{background:#2c2c2e}}
.field textarea{resize:none;min-height:64px;line-height:1.5}
.field textarea:focus,.field input:focus,.field select:focus{border-color:var(--accent)}
.chips{display:flex;gap:8px}
.chips.wrap{flex-wrap:wrap}
.chip{flex:1;padding:10px 0;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:13px;color:var(--muted);text-align:center}
@media (prefers-color-scheme:dark){.chip{background:#2c2c2e}}
.chips.wrap .chip{flex:1 1 30%}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.staredit{display:flex;gap:6px}
.staredit button{flex:1;padding:8px 0;font-size:22px;color:var(--line);text-align:center}
.staredit button.on{color:var(--gold)}
.mini{font-size:12px;color:var(--accent);font-weight:600;padding:4px 6px}
.pick-head{display:flex;align-items:center;gap:4px;margin-bottom:6px}
.pick-head label{flex:1;margin:0}
.picklist{max-height:300px;overflow-y:auto;border:1px solid var(--line);border-radius:10px}
.picklist .prow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.picklist .prow:last-child{border-bottom:0}
.picklist .prow:active{background:var(--line)}
.picklist .pnm{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-actions{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;padding:13px 0;border-radius:11px;font-size:15.5px;text-align:center;font-weight:600}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:var(--bg);color:var(--text)}
@media (prefers-color-scheme:dark){.btn.ghost{background:#2c2c2e}}
.btn.danger{background:transparent;color:var(--danger)}
.btn:active{opacity:.75}
.switchline{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.switchline:last-child{border-bottom:0}
.switchline .lb{flex:1;font-size:14.5px}
.switchline .st{font-size:11.5px;color:var(--muted)}
.tgl{width:48px;height:29px;border-radius:15px;background:var(--line);flex:none;position:relative;transition:background .15s}
.tgl::after{content:"";position:absolute;top:2px;left:2px;width:25px;height:25px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.tgl.on{background:var(--ok)}
.tgl.on::after{transform:translateX(19px)}

/* ---------- 菜单 / 快照 / 指南 ---------- */
.menu-list{background:var(--card);border-radius:var(--r);overflow:hidden;margin:0 14px}
.menu-list button{display:block;width:100%;text-align:left;padding:15px 16px;font-size:15.5px;border-bottom:1px solid var(--line)}
.menu-list button:last-child{border-bottom:0}
.menu-list button.danger{color:var(--danger)}
.menu-list button:active{background:var(--line)}
.menu-list button .sm{font-size:11.5px;color:var(--muted);display:block;margin-top:2px}
.warnbar{background:#ff950022;color:#c86a00;font-size:12.5px;padding:9px 14px;text-align:center;line-height:1.6}
@media (prefers-color-scheme:dark){.warnbar{color:#ffb340}}
.warnbar button{color:inherit;text-decoration:underline;font-weight:700;font-size:12.5px;margin-left:4px}
.warnbar.danger{background:#ff3b3022;color:#d70015}
@media (prefers-color-scheme:dark){.warnbar.danger{color:#ff6961}}
.toast{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 64px);z-index:200;
  background:#1c1c1e;color:#fff;border-radius:12px;padding:13px 14px;display:flex;align-items:center;gap:12px;
  font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
@media (prefers-color-scheme:dark){.toast{background:#2c2c2e}}
.toast .msg{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast button{color:#5e5ce6;font-weight:600;font-size:14px;flex:none}
@media (prefers-color-scheme:dark){.toast button{color:#7d7aff}}
.snap{margin-bottom:10px;padding:12px 14px;background:var(--bg);border-radius:10px}
.snap .t{font-size:13.5px;font-weight:600;margin-bottom:3px}
.snap .d{font-size:11.5px;color:var(--muted);margin-bottom:9px}
.snap button{font-size:13px;color:var(--accent);font-weight:600}
.guide{padding:0 2px 4px;font-size:13.5px;line-height:1.75}
.guide h3{font-size:14px;margin:16px 0 6px;font-weight:650}
.guide h3:first-child{margin-top:2px}
.guide ul{margin:0;padding-left:20px}
.guide li{margin-bottom:5px}
.guide code{background:var(--bg);border-radius:5px;padding:1px 5px;font-size:12.5px}
.guide .q{color:var(--muted);font-size:12.5px}
</style>
</head>
<body>

<div class="topbar">
  <h1 id="pageTitle">周度</h1>
  <button class="iconbtn hidden" id="btnCal" aria-label="日历">🗓</button>
  <button class="iconbtn hidden" id="btnAdd" aria-label="新建">＋</button>
  <button class="iconbtn" id="btnMenu" aria-label="更多">⋯</button>
</div>

<div id="storeWarn" class="warnbar hidden"></div>

<div id="pageWeek" class="page">
  <div class="scrollarea" id="weekScroll">
    <div class="wbar" id="weekBar"></div>
    <div id="weekList"></div>
  </div>
</div>

<div id="pageBiz" class="page hidden">
  <div class="scrollarea" id="bizList"></div>
</div>

<div id="pageClients" class="page hidden">
  <div class="scrollarea" id="clientList"></div>
</div>

<div class="tabbar">
  <button id="tabWeek" class="on"><span class="ic">🗓</span>周度</button>
  <button id="tabBiz"><span class="ic">💼</span>业务</button>
  <button id="tabClients"><span class="ic">▦</span>客户</button>
</div>

<div id="detailScreen" class="screen hidden">
  <div class="screen-head">
    <button class="back" id="btnBack">‹ 返回</button>
    <h2 id="detailTitle"></h2>
    <button class="iconbtn hidden" id="btnDetailAdd" aria-label="新建">＋</button>
  </div>
  <div class="screen-body" id="detailBody"></div>
  <button id="fabBack" class="fabback" aria-label="返回">‹</button>
</div>

<div id="mask" class="mask hidden">
  <div class="sheet">
    <div class="sheet-grip"></div>
    <div id="sheetBox"></div>
  </div>
</div>

<div id="toast" class="toast hidden">
  <div class="msg"></div>
  <button id="toastBtn"></button>
</div>

<input type="file" id="fileInput" accept="application/json,.json" class="hidden">

<script>
'use strict';

/* ============ 常量 ============ */
var KEY = 'work.assistant.v1';          // 沿用旧键，保证老数据不丢（靠 version 字段迁移）
var SNAP_KEY = 'work.assistant.snapshots';
var SNAP_META = 'work.assistant.snapmeta';
var CORRUPT_KEY = 'work.assistant.corrupt';
var SNAP_MAX = 3;
var DAY = 86400000;
var INF = 9007199254740991;
var DB_VERSION = 4;

/* 客户层级：顺序即层级高低，最上面的最高 */
var TIERS = [
  { k:'seed',  n:'金种子',  c:'#a07d00', bg:'#ffd60a33' },
  { k:'t368',  n:'top368',  c:'#ff3b30', bg:'#ff3b3022' },
  { k:'t1000', n:'top1000', c:'#e08400', bg:'#ff950022' },
  { k:'t1500', n:'top1500', c:'#0a84ff', bg:'#0a84ff22' },
  { k:'ndka',  n:'NDKA+',   c:'#8e8e93', bg:'#8e8e9322' },
  { k:'brk',   n:'破格商',   c:'#af52de', bg:'#af52de22' },
  { k:'tier8', n:'tier8',   c:'#0a84ff', bg:'#5ac8fa22' }
];

/* ============ 工具 ============ */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function p2(n){ return (n<10?'0':'')+n; }
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function $(id){ return document.getElementById(id); }
function mmdd(ts){ var d=new Date(ts); return (d.getMonth()+1)+'/'+d.getDate(); }
function toDateInput(ts){ var d=new Date(ts); return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }
function toLocalInput(ts){ var d=new Date(ts); return toDateInput(ts)+'T'+p2(d.getHours())+':'+p2(d.getMinutes()); }
function fmtDateTime(ts){
  var d=new Date(ts);
  return d.getFullYear()+'/'+p2(d.getMonth()+1)+'/'+p2(d.getDate())+' '+p2(d.getHours())+':'+p2(d.getMinutes());
}
function fmtDate(ts){ var d=new Date(ts); return d.getFullYear()+'/'+p2(d.getMonth()+1)+'/'+p2(d.getDate()); }
function clampStars(n){ n = parseInt(n,10)||3; return Math.max(1, Math.min(5, n)); }
function starsText(n){ n = clampStars(n); var s=''; for(var i=1;i<=5;i++) s += (i<=n?'★':'☆'); return s; }
function num(v){ var n = parseFloat(v); return isNaN(n) ? 0 : n; }
function money(v){
  var n = Math.round(num(v)*100)/100;
  return '¥' + n.toLocaleString('zh-CN', { maximumFractionDigits:2 });
}

/* 层级 / 渠道 / 业务 */
function tierOf(t){ for(var i=0;i<TIERS.length;i++) if(TIERS[i].k===t) return TIERS[i]; return TIERS[TIERS.length-1]; }
function tierIdx(o){ var k=(o&&o.tier)?o.tier:o; for(var i=0;i<TIERS.length;i++) if(TIERS[i].k===k) return i; return TIERS.length; }
function channelOf(k){ for(var i=0;i<CHANNELS.length;i++) if(CHANNELS[i].k===k) return CHANNELS[i]; return CHANNELS[0]; }
function bizOf(k){ for(var i=0;i<BIZS.length;i++) if(BIZS[i].k===k) return BIZS[i]; return BIZS[0]; }

/* 月份 / 周 */
function monthKey(ts){ var d=new Date(ts); return d.getFullYear()+'-'+p2(d.getMonth()+1); }
function monthLabel(key){ var p=String(key).split('-'); return p[0]+'年'+parseInt(p[1],10)+'月'; }
function curMonthKey(){ return monthKey(Date.now()); }
function activeMonth(){ return viewMonth || curMonthKey(); }
function inMonth(ts, mk){ return !!ts && monthKey(ts)===mk; }
function mondayOf(ts){
  var d = new Date(ts); d.setHours(0,0,0,0);
  var wd = (d.getDay()+6)%7;
  d.setDate(d.getDate()-wd);
  return d.getTime();
}
function isoWeek(ts){
  var d = new Date(ts); d.setHours(0,0,0,0);
  var day = (d.getDay()+6)%7;
  d.setDate(d.getDate()-day+3);
  var year = d.getFullYear();
  var jan4 = new Date(year,0,4);
  var jd = (jan4.getDay()+6)%7;
  jan4.setDate(jan4.getDate()-jd+3);
  var week = 1 + Math.round((d-jan4)/(7*DAY));
  return { year: year, week: week };
}
function weekKeyOf(ts){ var w = isoWeek(ts); return w.year+'-W'+p2(w.week); }
function weekStartFromKey(key){
  var m = /^(\d{4})-W(\d{2})$/.exec(String(key));
  if(!m) return mondayOf(Date.now());
  var y = +m[1], wk = +m[2];
  var jan4 = new Date(y,0,4);
  var jd = (jan4.getDay()+6)%7;
  var w1 = jan4.getTime() - jd*DAY;
  return w1 + (wk-1)*7*DAY;
}
function weekLabel(key){
  var ws = weekStartFromKey(key);
  var w = String(key).split('-W')[1];
  return 'W'+parseInt(w,10)+' · '+mmdd(ws)+'–'+mmdd(ws+6*DAY);
}
function curWeekKey(){ return weekKeyOf(Date.now()); }
function activeWeek(){ return viewWeek || curWeekKey(); }
function weekRange(key){ var ws = weekStartFromKey(key); return { start: ws, end: ws + 7*DAY }; }

/* 倒计时文案 */
function countdown(ms){
  var m = Math.floor(ms/60000);
  if(m < 1) return '不到 1 分钟';
  if(m < 60) return m + ' 分钟';
  var h = Math.floor(m/60);
  if(h < 24) return h + ' 小时';
  var d = Math.floor(h/24), rh = h%24;
  return d + ' 天' + (rh ? ' '+rh+' 小时' : '');
}
function dayLabel(ts){
  var d = new Date(ts), now = new Date();
  var a = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  var b = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  if(a === b) return '今天';
  if(a === b + DAY) return '明天';
  return mmdd(ts);
}

/* ============ 存储 ============ */
function warn(msg, danger){
  var el = $('storeWarn');
  el.innerHTML = msg;
  el.classList.toggle('danger', !!danger);
  el.classList.remove('hidden');
}
function clearWarn(){ $('storeWarn').classList.add('hidden'); }
function warnCorrupt(){
  warn('⚠️ 本地数据读取失败，已用空数据启动。<b>原始内容已保留</b>，可下载后排查。' +
    '<button id="btnCorruptDl">下载原始数据</button><button id="btnCorruptClear">知道了</button>', true);
  $('btnCorruptDl').onclick = function(){
    download('工作助手-损坏数据-'+toDateInput(Date.now())+'.txt', corruptRaw || '', 'text/plain');
  };
  $('btnCorruptClear').onclick = function(){
    try{ localStorage.removeItem(CORRUPT_KEY); }catch(e){}
    corruptRaw = null; clearWarn();
  };
}
function load(){
  var raw = null, parseFailed = false;
  try{ raw = localStorage.getItem(KEY); }catch(e){ storageOK = false; }
  if(!storageOK){
    try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); storageOK = true; }
    catch(e){ storageOK = false; }
    if(!storageOK) warn('⚠️ 本浏览器不允许本地存储，数据在关闭页面后会丢失。请定期导出备份。', true);
  }
  if(raw){
    try{
      var o = JSON.parse(raw);
      if(o && Array.isArray(o.clients) && Array.isArray(o.tasks)) db = o;
      else parseFailed = true;
    }catch(e){ parseFailed = true; }
    if(parseFailed){
      corruptRaw = raw;
      loadFailed = true;
      try{ localStorage.setItem(CORRUPT_KEY, raw); }catch(e){}
      warnCorrupt();
    }
  }
  if(!parseFailed && !corruptRaw){
    try{
      var kept = localStorage.getItem(CORRUPT_KEY);
      if(kept){ corruptRaw = kept; warnCorrupt(); }
    }catch(e){}
  }
}
function save(){
  if(!storageOK) return;
  try{
    localStorage.setItem(KEY, JSON.stringify(db));
    saveFailed = false;
  }catch(e){
    if(!saveFailed){
      saveFailed = true;
      warn('⚠️ 保存失败，浏览器存储空间可能已满。<b>请立即导出备份</b>，否则新数据会丢。', true);
    }
  }
}
function snapPayload(){
  return {
    visitGoals: db.visitGoals, visits: db.visits,
    gov: db.gov, emergent: db.emergent, recycle: db.recycle,
    weeks: db.weeks
  };
}
function snapshot(){
  if(!storageOK || saveFailed || loadFailed) return;
  try{
    var today = toDateInput(Date.now());
    if(localStorage.getItem(SNAP_META) === today) return;
    var list = readSnapshots();
    list.push({ at:Date.now(), clients:db.clients, tasks:db.tasks, payload:snapPayload() });
    if(list.length > SNAP_MAX) list = list.slice(-SNAP_MAX);
    localStorage.setItem(SNAP_KEY, JSON.stringify(list));
    localStorage.setItem(SNAP_META, today);
  }catch(e){ /* 空间不足就跳过，主数据已经安全 */ }
}
function readSnapshots(){
  try{
    var v = JSON.parse(localStorage.getItem(SNAP_KEY) || '[]');
    return Array.isArray(v) ? v : [];
  }catch(e){ return []; }
}
function pushSnapshot(){
  try{
    var l = readSnapshots();
    l.push({ at:Date.now(), clients:db.clients, tasks:db.tasks, payload:snapPayload() });
    if(l.length > SNAP_MAX) l = l.slice(-SNAP_MAX);
    localStorage.setItem(SNAP_KEY, JSON.stringify(l));
  }catch(e){}
}

/* id 规范化：所有 id 都会拼进 HTML 属性，必须是安全形状 */
function normalizeAllIds(){
  var map = {}, seen = {};
  function fix(arr){
    (arr||[]).forEach(function(t){
      if(!t) return;
      var raw = (typeof t.id==='string'||typeof t.id==='number') ? String(t.id) : '';
      if(raw && /^[A-Za-z0-9_-]{1,64}$/.test(raw) && !seen[raw]){
        seen[raw]=1; if(raw!==t.id) t.id=raw;
      }else{
        var nid = uid(); seen[nid]=1;
        if(raw) map[raw]=nid;
        t.id = nid;
      }
    });
  }
  fix(db.clients); fix(db.tasks);
  fix(db.visits);
  fix(db.gov.customers); fix(db.gov.visits); fix(db.gov.orders);
  fix(db.emergent.customers); fix(db.emergent.visits); fix(db.emergent.orders);
  fix(db.recycle.customers); fix(db.recycle.records);
  Object.keys(db.weeks).forEach(function(k){ fix(db.weeks[k].mappings); });
  /* 引用重映射 */
  function remap(obj, field){ if(obj && map[obj[field]]) obj[field] = map[obj[field]]; }
  db.tasks.forEach(function(t){ (t.links||[]).forEach(function(l){ remap(l,'clientId'); }); });
  db.visits.forEach(function(v){ remap(v,'clientId'); });
  ['gov','emergent'].forEach(function(k){
    db[k].visits.forEach(function(v){ remap(v,'customerId'); });
    db[k].orders.forEach(function(o){ remap(o,'customerId'); });
  });
  db.recycle.records.forEach(function(r){ remap(r,'customerId'); });
  Object.keys(db.weeks).forEach(function(k){
    var b = db.weeks[k].bill;
    if(b && Array.isArray(b.items)) b.items.forEach(function(it){ remap(it,'clientId'); });
  });
}

/* ============ 数据迁移（每次启动都跑，幂等） ============ */
function migrate(){
  var changed = false;
  function needObj(k, shape){
    if(!db[k] || typeof db[k]!=='object' || Array.isArray(db[k])){ db[k] = shape; return true; }
    var c = false;
    Object.keys(shape).forEach(function(f){
      if(!Array.isArray(db[k][f])){ db[k][f] = shape[f]; c = true; }
    });
    return c;
  }
  if(!Array.isArray(db.clients)){ db.clients = []; changed = true; }
  if(!Array.isArray(db.tasks)){ db.tasks = []; changed = true; }
  if(!db.visitGoals || typeof db.visitGoals!=='object' || Array.isArray(db.visitGoals)){ db.visitGoals = {}; changed = true; }
  if(!Array.isArray(db.visits)){ db.visits = []; changed = true; }
  if(needObj('gov', { customers:[], visits:[], orders:[] })) changed = true;
  if(needObj('emergent', { customers:[], visits:[], orders:[] })) changed = true;
  if(needObj('recycle', { customers:[], records:[] })) changed = true;
  if(!db.weeks || typeof db.weeks!=='object' || Array.isArray(db.weeks)){ db.weeks = {}; changed = true; }

  /* 旧层级键改名：top360 → top368 */
  db.clients.forEach(function(c){
    if(c.tier === 't360'){ c.tier = 't368'; changed = true; }
  });
  /* 各业务客户字段补全 */
  db.gov.customers.forEach(function(c){
    if(typeof c.contact!=='string'){ c.contact=''; changed=true; }
    if(typeof c.phone!=='string'){ c.phone=''; changed=true; }
    if(typeof c.address!=='string'){ c.address=''; changed=true; }
    if(typeof c.opened!=='boolean'){ c.opened=false; changed=true; }
    if(typeof c.maintained!=='boolean'){ c.maintained=false; changed=true; }
  });
  db.emergent.customers.forEach(function(c){
    if(typeof c.contact!=='string'){ c.contact=''; changed=true; }
    if(typeof c.phone!=='string'){ c.phone=''; changed=true; }
    if(typeof c.address!=='string'){ c.address=''; changed=true; }
    if(typeof c.opened!=='boolean'){ c.opened=false; changed=true; }
    if(typeof c.maintained!=='boolean'){ c.maintained=false; changed=true; }
    if(typeof c.amount!=='number'){ c.amount=0; changed=true; }
  });
  db.recycle.customers.forEach(function(c, i){
    if(!c.months || typeof c.months!=='object'){ c.months = {}; changed=true; }
    if(typeof c.sort!=='number'){ c.sort = i; changed=true; }
  });
  /* 周数据结构补全 */
  Object.keys(db.weeks).forEach(function(k){
    var w = db.weeks[k];
    if(!w || typeof w!=='object'){ db.weeks[k] = { mappings:[], bill:null }; changed=true; return; }
    if(!Array.isArray(w.mappings)){ w.mappings = []; changed=true; }
    w.mappings.forEach(function(m){
      if(typeof m.biz!=='string'){ m.biz='visit'; changed=true; }
      if(typeof m.done!=='boolean'){ m.done=false; changed=true; }
      if(typeof m.createdAt!=='number'){ m.createdAt=Date.now(); changed=true; }
    });
  });
  /* v3 → v4：一次性清理 —— 周记录只留上一周起（删 W40 及以前），
     月记录只留上月起（删 8 月及以前）。用户明确要求历史记录从近期开始。 */
  if(db.version < 4){
    var keepWeekStart = weekStartFromKey(weekKeyOf(mondayOf(Date.now()) - 7*DAY));
    Object.keys(db.weeks).forEach(function(k){
      try{
        if(weekStartFromKey(k) < keepWeekStart) delete db.weeks[k];
      }catch(e){ delete db.weeks[k]; }
    });
    var cutDate = new Date();
    cutDate = new Date(cutDate.getFullYear(), cutDate.getMonth()-1, 1);   // 上月 1 号
    var cutTs = cutDate.getTime(), cutKey = monthKey(cutTs);
    db.visits = db.visits.filter(function(v){ return v.at >= cutTs; });
    ['gov','emergent'].forEach(function(k){
      db[k].visits = db[k].visits.filter(function(v){ return v.at >= cutTs; });
      db[k].orders = db[k].orders.filter(function(o){ return o.at >= cutTs; });
    });
    db.recycle.records = db.recycle.records.filter(function(r){ return r.at >= cutTs; });
    db.recycle.customers.forEach(function(c){
      if(c.months && typeof c.months === 'object'){
        Object.keys(c.months).forEach(function(mk){ if(mk < cutKey) delete c.months[mk]; });
      }
    });
    changed = true;
  }
  if(db.version !== DB_VERSION){ db.version = DB_VERSION; changed = true; }
  if(changed) save();
}

/* ============ 导入校验与归一化 ============ */
function normalizeImport(o){
  if(!o || !Array.isArray(o.clients) || !Array.isArray(o.tasks))
    throw new Error('缺少 clients/tasks 数组 —— 可能不是本应用的备份文件');
  var out = {
    version: DB_VERSION, clients: [], tasks: [],
    visitGoals: {}, visits: [],
    gov: { customers:[], visits:[], orders:[] },
    emergent: { customers:[], visits:[], orders:[] },
    recycle: { customers:[], records:[] },
    weeks: {}
  };
  function str(v){ return typeof v==='string' ? v : ''; }
  function tsv(v, d){ return typeof v==='number' ? v : d; }

  o.clients.forEach(function(c){
    if(!c || typeof c!=='object' || typeof c.name!=='string') return;
    out.clients.push({
      id:c.id, name:c.name,
      tier: typeof c.tier==='string' ? (c.tier==='t360'?'t368':c.tier) : 'ndka',
      channel: (c.channel==='fd'||c.channel==='exp'||c.channel==='both') ? c.channel : 'fd',
      stars: clampStars(c.stars), note: str(c.note),
      createdAt: tsv(c.createdAt, Date.now()), deleted: !!c.deleted
    });
  });
  o.tasks.forEach(function(t){
    if(!t || typeof t!=='object' || typeof t.name!=='string') return;
    out.tasks.push({
      id:t.id, name:t.name, stars:clampStars(t.stars),
      dueAt: tsv(t.dueAt, null), createdAt: tsv(t.createdAt, Date.now()),
      doneAt: tsv(t.doneAt, null), deleted: !!t.deleted,
      links: Array.isArray(t.links) ? t.links.filter(function(l){
        return l && typeof l.clientId==='string';
      }).map(function(l){
        return { clientId:l.clientId, done:!!l.done, doneAt: tsv(l.doneAt, null) };
      }) : []
    });
  });
  if(o.visitGoals && typeof o.visitGoals==='object' && !Array.isArray(o.visitGoals)) out.visitGoals = o.visitGoals;
  (Array.isArray(o.visits)?o.visits:[]).forEach(function(v){
    if(!v || typeof v.clientId!=='string') return;
    out.visits.push({ id:v.id, clientId:v.clientId, at: tsv(v.at, Date.now()), report: str(v.report) });
  });
  ['gov','emergent'].forEach(function(bk){
    var src = (o[bk] && typeof o[bk]==='object') ? o[bk] : {};
    (Array.isArray(src.customers)?src.customers:[]).forEach(function(c){
      if(!c || typeof c.name!=='string') return;
      var rec = {
        id:c.id, name:c.name, contact:str(c.contact), phone:str(c.phone), address:str(c.address),
        opened:!!c.opened, maintained:!!c.maintained, stars:clampStars(c.stars),
        createdAt: tsv(c.createdAt, Date.now()), deleted: !!c.deleted
      };
      if(bk==='emergent') rec.amount = num(c.amount);
      out[bk].customers.push(rec);
    });
    (Array.isArray(src.visits)?src.visits:[]).forEach(function(v){
      if(!v || typeof v.customerId!=='string') return;
      out[bk].visits.push({ id:v.id, customerId:v.customerId, at: tsv(v.at, Date.now()), note: str(v.note) });
    });
    (Array.isArray(src.orders)?src.orders:[]).forEach(function(x){
      if(!x || typeof x.customerId!=='string') return;
      out[bk].orders.push({
        id:x.id, customerId:x.customerId, at: tsv(x.at, Date.now()),
        count: num(x.count), amount: num(x.amount)
      });
    });
  });
  var rsrc = (o.recycle && typeof o.recycle==='object') ? o.recycle : {};
  (Array.isArray(rsrc.customers)?rsrc.customers:[]).forEach(function(c, i){
    if(!c || typeof c.name!=='string') return;
    out.recycle.customers.push({
      id:c.id, name:c.name,
      months: (c.months && typeof c.months==='object' && !Array.isArray(c.months)) ? c.months : {},
      sort: tsv(c.sort, i), createdAt: tsv(c.createdAt, Date.now()), deleted: !!c.deleted
    });
  });
  (Array.isArray(rsrc.records)?rsrc.records:[]).forEach(function(r){
    if(!r) return;
    out.recycle.records.push({
      id:r.id, customerId: str(r.customerId), customerName: str(r.customerName),
      model: str(r.model), qty: num(r.qty), at: tsv(r.at, Date.now())
    });
  });
  if(o.weeks && typeof o.weeks==='object' && !Array.isArray(o.weeks)){
    Object.keys(o.weeks).forEach(function(k){
      var w = o.weeks[k];
      if(!w || typeof w!=='object') return;
      var nw = { mappings:[], bill:null };
      (Array.isArray(w.mappings)?w.mappings:[]).forEach(function(m){
        if(!m) return;
        nw.mappings.push({
          id:m.id, biz: typeof m.biz==='string'?m.biz:'visit',
          done: !!m.done, doneAt: tsv(m.doneAt,null), createdAt: tsv(m.createdAt, Date.now())
        });
      });
      if(w.bill && Array.isArray(w.bill.items)){
        nw.bill = { inited:true, items: w.bill.items.filter(function(it){ return it && typeof it.clientId==='string'; })
          .map(function(it){
            return { clientId:it.clientId, name:str(it.name), mobile:!!it.mobile, fusion:!!it.fusion, removed:!!it.removed };
          }) };
      }
      out.weeks[k] = nw;
    });
  }
  /* 清掉指向不存在对象的关联 */
  var cids = {}, gids = {}, eids = {}, rids = {};
  out.clients.forEach(function(c){ cids[c.id]=1; });
  out.gov.customers.forEach(function(c){ gids[c.id]=1; });
  out.emergent.customers.forEach(function(c){ eids[c.id]=1; });
  out.recycle.customers.forEach(function(c){ rids[c.id]=1; });
  out.tasks.forEach(function(t){ t.links = t.links.filter(function(l){ return cids[l.clientId]; }); });
  out.visits = out.visits.filter(function(v){ return cids[v.clientId]; });
  out.gov.visits = out.gov.visits.filter(function(v){ return gids[v.customerId]; });
  out.gov.orders = out.gov.orders.filter(function(v){ return gids[v.customerId]; });
  out.emergent.visits = out.emergent.visits.filter(function(v){ return eids[v.customerId]; });
  out.emergent.orders = out.emergent.orders.filter(function(v){ return eids[v.customerId]; });
  out.recycle.records = out.recycle.records.filter(function(r){ return !r.customerId || rids[r.customerId]; });
  Object.keys(out.weeks).forEach(function(k){
    var b = out.weeks[k].bill;
    if(b) b.items = b.items.filter(function(it){ return cids[it.clientId]; });
  });
  return out;
}

function download(filename, text, mime){
  var blob = new Blob([text], { type: mime || 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
/* ============ 领域：通用 ============ */
function activeClients(){ return db.clients.filter(function(c){ return !c.deleted; }); }
function activeTasks(){ return db.tasks.filter(function(t){ return !t.deleted; }); }
function clientById(id){ for(var i=0;i<db.clients.length;i++) if(db.clients[i].id===id) return db.clients[i]; return null; }
function taskById(id){ for(var i=0;i<db.tasks.length;i++) if(db.tasks[i].id===id) return db.tasks[i]; return null; }
function byIdIn(arr, id){ for(var i=0;i<arr.length;i++) if(arr[i].id===id) return arr[i]; return null; }
function govById(id){ return byIdIn(db.gov.customers, id); }
function emgById(id){ return byIdIn(db.emergent.customers, id); }
function recById(id){ return byIdIn(db.recycle.customers, id); }
function activeIn(arr){ return (arr||[]).filter(function(x){ return x && !x.deleted; }); }
function sumBy(arr, k){ return (arr||[]).reduce(function(a,x){ return a + num(k?x[k]:x); }, 0); }
function badgeHTML(tierKey){
  var t = tierOf(tierKey);
  return '<span class="badge" style="color:'+t.c+';background:'+t.bg+'">'+esc(t.n)+'</span>';
}

/* ---- 任务完成模型：任务完成 = 所有有效关联客户都勾完 ---- */
function activeLinks(t){
  return (t.links||[]).filter(function(l){
    var c = clientById(l.clientId);
    return c && !c.deleted;
  });
}
function taskDone(t){
  var ls = activeLinks(t);
  return ls.length ? ls.every(function(l){ return l.done; }) : !!t.doneAt;
}
function taskLinkStats(t){
  var ls = activeLinks(t);
  return { total: ls.length, undone: ls.filter(function(l){ return !l.done; }).length };
}
function clientTaskStats(c){
  var ts = activeTasks().filter(function(t){
    return activeLinks(t).some(function(l){ return l.clientId===c.id; });
  });
  return { total: ts.length, undone: ts.filter(function(t){ return !taskDone(t); }).length };
}
function isOverdue(t){ return !taskDone(t) && !!t.dueAt && t.dueAt < Date.now(); }
function dueInfo(t){
  if(!t.dueAt) return null;
  var d = new Date(t.dueAt);
  var hm = p2(d.getHours())+':'+p2(d.getMinutes());
  var diff = t.dueAt - Date.now();
  if(taskDone(t)) return { text:'⏰ '+dayLabel(t.dueAt)+' '+hm, cls:'' };
  if(diff < 0) return { text:'⏰ 已逾期 '+countdown(-diff), cls:'over' };
  return { text:'⏰ '+dayLabel(t.dueAt)+' '+hm+' · 还剩 '+countdown(diff), cls:(diff<DAY?'soon':'') };
}

/* ---- 排序 ---- */
/* 客户：星级优先 → 层级 → 创建时间 */
function sortedClients(){
  return activeClients().slice().sort(function(a,b){
    return b.stars-a.stars || tierIdx(a)-tierIdx(b) || a.createdAt-b.createdAt;
  });
}
/* 任务：截止早优先（无截止沉底）→ 星级 → 创建时间 */
function sortTasks(list){
  return list.slice().sort(function(a,b){
    return (a.dueAt||INF)-(b.dueAt||INF) || b.stars-a.stars || a.createdAt-b.createdAt;
  });
}
/* 业务客户：星级优先 → 创建时间 */
function sortByStars(list){
  return list.slice().sort(function(a,b){
    return b.stars-a.stars || a.createdAt-b.createdAt;
  });
}

/* 本月拜访是否挤在两周内（只提示，不阻止） */
function emgSpreadWarn(){

  var ts = db.emergent.visits.filter(function(v){ return inMonth(v.at, mo); })
    .map(function(v){ return v.at; }).sort(function(a,b){ return a-b; });

}

/* ============ 领域：周度 ============ */
function weekData(key){
  if(!db.weeks[key] || typeof db.weeks[key]!=='object') db.weeks[key] = { mappings:[], bill:null };
  var w = db.weeks[key];
  if(!Array.isArray(w.mappings)) w.mappings = [];
  return w;
}
function tasksOfWeek(key, onlyDone){
  var r = weekRange(key);
  return sortTasks(activeTasks().filter(function(t){
    if(t.doneAt && t.doneAt < r.start) return false;   // 更早已完成
    if(t.createdAt >= r.end) return false;             // 更晚才创建
    if(onlyDone) return !!t.doneAt && t.doneAt >= r.start && t.doneAt < r.end;
    return true;
  }));
}
function mappingsOf(key, onlyDone){
  return weekData(key).mappings.filter(function(m){ return onlyDone ? !!m.done : true; })
    .sort(function(a,b){ return a.createdAt-b.createdAt; });
}
function billDone(it){ return !!(it.mobile && it.fusion); }
/* 提单勾选规则：
   all    → 左边圆圈：整体完成/取消（两个标记一起变）
   mobile → 手机提单：取消手机时会连融合一起取消（否则会剩一个孤立的融合）
   fusion → 融合提单：勾上融合时会自动补上手机 */
function billToggle(it, field){
  if(field === 'all'){
    var target = !billDone(it);
    it.mobile = target;
    it.fusion = target;
  }else if(field === 'mobile'){
    it.mobile = !it.mobile;
    if(!it.mobile) it.fusion = false;
  }else{
    it.fusion = !it.fusion;
    if(it.fusion) it.mobile = true;
  }
  return billDone(it);
}
/* 历史/当前/未来周的判定：周起点早于本周一 = 历史 */
function isHistoryWeek(key){ return weekStartFromKey(key) < mondayOf(Date.now()); }
/* 提单清单自动补客户：只在当前周和未来周做（历史周保持原样）。
   已手动 × 移除的（removed:true）不会补回来 —— 尊重用户的删除。 */
function syncBill(bill){
  if(!bill) return 0;
  var have = {};
  bill.items.forEach(function(x){ have[x.clientId] = 1; });
  var added = 0;
  sortedClients().forEach(function(c){
    if(!have[c.id]){
      bill.items.push({ clientId:c.id, name:c.name, mobile:false, fusion:false, removed:false });
      added++;
    }
  });
  return added;
}
function ensureBill(key){
  var w = weekData(key);
  var created = !w.bill;
  if(created) w.bill = { inited:true, items:[] };
  var added = isHistoryWeek(key) ? 0 : syncBill(w.bill);
  if(created || added) save();
  return w.bill;
}
/* 周度行上的计数：不改动数据也能算准。
   当前/未来周：还没进清单的客户算作未完成；
   历史周：只按当时清单算，没建过清单就是 0。 */
function billViewStats(key){
  var bill = weekData(key).bill;
  var items = bill ? bill.items.filter(function(x){ return !x.removed; }) : [];
  var undone = items.filter(function(x){ return !billDone(x); }).length;
  if(!isHistoryWeek(key)){
    var have = {};
    bill && bill.items.forEach(function(x){ have[x.clientId] = 1; });
    var extra = activeClients().filter(function(c){ return !have[c.id]; });
    return { total: items.length + extra.length, undone: undone + extra.length };
  }
  return { total: items.length, undone: undone };
}
function billStats(bill){
  var items = bill ? bill.items.filter(function(x){ return !x.removed; }) : [];
  return { total: items.length, undone: items.filter(function(x){ return !billDone(x); }).length };
}
function weekList(nBack, nFwd){
  var out = [], base = weekStartFromKey(curWeekKey());
  for(var i = nBack; i > 0; i--) out.push(weekKeyOf(base - i*7*DAY));
  out.push(curWeekKey());
  for(var j = 1; j <= nFwd; j++) out.push(weekKeyOf(base + j*7*DAY));
  return out;
}

function renderWeek(){
  var key = activeWeek();
  var r = weekRange(key);
  var todayMon = mondayOf(Date.now());
  var isCur = key === curWeekKey();
  var isPast = r.start < todayMon;

  /* 周条计数：任务 + 业务映射 的 未完成/总数 */
  var wkTasks = tasksOfWeek(key, false);
  var wkMaps = weekData(key).mappings;
  var undoneN = wkTasks.filter(function(t){ return !taskDone(t); }).length
               + wkMaps.filter(function(m){ return !m.done; }).length;
  var totalN = wkTasks.length + wkMaps.length;
  var wNo = 'W' + parseInt(String(key).split('-W')[1], 10);

  var bar = '<div class="wnum">'+wNo+'</div>'
    + '<div class="wmeta"><span class="tag">'+(isCur?'本周':(isPast?'历史':'未来'))+'</span>'
    + '<span class="rng">'+fmtDate(r.start)+' – '+fmtDate(r.end-DAY)+'</span></div>'
    + '<div class="wstats"><b>'+undoneN+'</b><span>/'+totalN+'</span><i>未完成</i></div>';
  if(!isCur) bar += '<button class="back" id="wkBack">回到本周</button>';
  $('weekBar').innerHTML = bar;
  $('weekBar').classList.toggle('alt', !isCur);
  if($('wkBack')) $('wkBack').onclick = function(){ viewWeek = null; renderWeek(); updateTopbar(); };

  var bill = weekData(key).bill;
  var bs = billViewStats(key);
  var nowSeg = (isPast ? weekSeg : 0);
  var tasks = tasksOfWeek(key, isPast ? nowSeg===1 : false);
  var maps = mappingsOf(key, isPast && nowSeg===1);

  var html = '<div class="list">'
    + '<div class="row pinned" id="billRow">'
    +   '<div class="body"><div class="nm">📱 提单任务</div>'
    +   '<div class="sub">手机提单 + 融合提单，两个都勾 = 该客户完成</div></div>'
    +   '<div class="side"><b>'+bs.undone+'</b> <i>未完成</i><span class="t2">共 <b>'+bs.total+'</b> 客户</span></div>'
    + '</div>'
    + '</div>';

  if(isPast){
    html += '<div class="seg" id="wkSeg" style="margin-top:14px">'
      + '<button data-v="0" class="'+(nowSeg===0?'on':'')+'">规划</button>'
      + '<button data-v="1" class="'+(nowSeg===1?'on':'')+'">完成</button></div>';
  }
  html += '<div class="sec-title">'+(isPast ? (nowSeg===1?'本 周 完 成':'本 周 规 划') : '本周任务')
    + '<span class="n">未完成会留到下一周</span></div>';
  if(!tasks.length){
    html += '<div class="empty" style="padding:26px">'
      + (isPast ? (nowSeg===1?'这一周没有完成记录':'这一周没有任务') : '本周还没有任务<br>点右上角 <b>＋</b> 添加任务或业务映射')
      + '</div>';
  }else{
    html += '<div class="list">' + tasks.map(taskRowHTML).join('') + '</div>';
  }

  html += '<div class="sec-title">业务映射<span class="n">点行进业务页 · 点右侧文字写本周规划</span></div>';
  if(!maps.length){
    html += '<div class="empty" style="padding:22px">'+(nowSeg===1&&isPast?'没有已完成的映射':'还没有映射<br>点右上角 <b>＋</b> 添加')+'</div>';
  }else{
    html += '<div class="list">' + maps.map(mappingRowHTML).join('') + '</div>';
  }

  $('weekList').innerHTML = html;
  $('billRow').onclick = function(){ openDetail('bill', key); };
  if($('wkSeg')) $('wkSeg').querySelectorAll('button').forEach(function(b){
    b.onclick = function(){ weekSeg = parseInt(b.getAttribute('data-v'),10); renderWeek(); };
  });
  $('weekList').querySelectorAll('[data-tid]').forEach(function(r){
    var id = r.getAttribute('data-tid');
    if(!id) return;
    r.onclick = function(){ openDetail('task', id); };
    var ck = r.querySelector('.check');
    if(ck) ck.onclick = function(e){ e.stopPropagation(); toggleTaskDone(taskById(id)); };
  });
  $('weekList').querySelectorAll('[data-mid]').forEach(function(r){
    var id = r.getAttribute('data-mid');
    r.onclick = function(){
      var m = weekData(key).mappings.filter(function(x){ return x.id===id; })[0];
      if(m) openDetail('biz', m.biz);
    };
    var ck = r.querySelector('.check');
    if(ck) ck.onclick = function(e){
      e.stopPropagation();
      var m = weekData(key).mappings.filter(function(x){ return x.id===id; })[0];
      if(!m) return;
      m.done = !m.done;
      m.doneAt = m.done ? Date.now() : null;
      save(); renderWeek();
    };
  });
  /* 点映射右侧文字 → 编辑本周规划 */
  $('weekList').querySelectorAll('[data-mn]').forEach(function(n){
    n.onclick = function(e){
      e.stopPropagation();
      var m = weekData(key).mappings.filter(function(x){ return x.id===n.getAttribute('data-mn'); })[0];
      if(m) openMappingSheet(key, m);
    };
  });
}

  if(top.type==='client') renderClientDetail(top.id);

  }).sort(function(a,b){
    return (taskDone(a)-taskDone(b)) || (a.dueAt||INF)-(b.dueAt||INF) || b.stars-a.stars;
  });

    + (c.note ? '<div class="note">'+esc(c.note)+'</div>' : '')
    + '<div class="meta">本月拜访 '+vn+' / '+visitQuotaOf(c)+' 次 · 创建于 '+fmtDate(c.createdAt)+'</div>'

    + '</div>'

  if(!ts.length){
    html += '<div class="empty" style="padding:30px">还没有关联任务<br>点右上角 <b>＋</b> 从任务里关联一个</div>';
  }else{
    html += '<div class="list">';
    ts.forEach(function(x){
      var l = x.links.filter(function(l){ return l.clientId===c.id; })[0];
      var myDone = l && l.done;
      var di = dueInfo(x);
      html += '<div class="row'+(myDone?' done':'')+'" data-tid="'+x.id+'">'
        + '<button class="check'+(myDone?' on':'')+'" data-ck="'+x.id+'"></button>'

        + '</div>'

  $('infoCard').onclick = function(){ openClientEditor(c.id); };
  var body = $('detailBody');
  body.querySelectorAll('[data-tid]').forEach(function(r){
    var tid = r.getAttribute('data-tid');
    r.onclick = function(){ openDetail('task', tid); };
    var ck = r.querySelector('.check');
    if(ck) ck.onclick = function(e){ e.stopPropagation(); toggleLink(taskById(tid), c.id); };

  }else{

        +   '<button class="dot'+(it.mobile?' on':'')+'" data-m="'+it.clientId+'">手机</button>'
        +   '<button class="dot'+(it.fusion?' on':'')+'" data-f="'+it.clientId+'">融合</button>'
        + '</div>'
        + '<button class="xbtn" data-x="'+it.clientId+'">×</button>'
        + '</div>';
    });
    html += '</div>';
  }
  html += '<div class="hint">点左边圆圈 = 该客户整体完成（手机+融合一起勾上）；也可以分别点「手机」「融合」，两个都勾即完成。<br>'
    + '「×」只把客户从这一周清单里移除，<b>不影响客户页的客户</b>。本周清单会自动补入新建的客户；历史周清单保持原样、可手动增补。</div>';

    var cid = r.getAttribute('data-item');
    var it = bill.items.filter(function(x){ return x.clientId===cid; })[0];
    if(!it) return;
    r.onclick = function(){ billToggle(it, 'all'); sync(); };
  });
  body.querySelectorAll('[data-m]').forEach(function(b){
    b.onclick = function(e){
      e.stopPropagation();
      var cid = b.getAttribute('data-m');
      var it = bill.items.filter(function(x){ return x.clientId===cid; })[0];
      if(!it) return;
      billToggle(it, 'mobile');
      sync();

  body.querySelectorAll('[data-f]').forEach(function(b){
    b.onclick = function(e){
      e.stopPropagation();
      var cid = b.getAttribute('data-f');
      var it = bill.items.filter(function(x){ return x.clientId===cid; })[0];
      if(!it) return;
      billToggle(it, 'fusion');

      if(!it) return;
      it.removed = true;
      save(); renderDetail();
      showToast('已从本周清单移除', '撤销', function(){ it.removed = false; save(); renderDetail(); });
    };
  });

function openBillPicker(key){
  var bill = ensureBill(key);
  var inList = {};
  bill.items.forEach(function(x){ if(!x.removed) inList[x.clientId]=1; });
  var cands = sortedClients().filter(function(c){ return !inList[c.id]; });
  openSheet('<h2>把客户加入本周清单</h2><div id="bpBox"></div>');
  var box = $('bpBox');
  if(!cands.length){
    box.innerHTML = '<div class="empty" style="padding:24px">客户页的客户都已在清单里</div>'
      + '<div class="sheet-actions"><button class="btn ghost" id="bpClose">关闭</button></div>';
    $('bpClose').onclick = closeSheet;
    return;
  }
  box.innerHTML = '<div class="picklist" style="max-height:50vh">' + cands.map(function(c){
    return '<div class="prow" data-cid="'+c.id+'"><span class="pnm">'+esc(c.name)+'</span>'
      + badgeHTML(c.tier)+'<span class="stars">'+starsText(c.stars)+'</span></div>';
  }).join('') + '</div>'
  + '<div class="sheet-actions"><button class="btn ghost" id="bpClose">关闭</button></div>';

  box.querySelectorAll('.prow').forEach(function(r){
    r.onclick = function(){
      var cid = r.getAttribute('data-cid');
      var c = clientById(cid);
      var exist = bill.items.filter(function(x){ return x.clientId===cid; })[0];
      if(exist){ exist.removed = false; }
      else bill.items.push({ clientId:cid, name:c?c.name:'', mobile:false, fusion:false, removed:false });
      save(); renderDetail();
    };
  });
}

function wireRecycleDrag(box){
  box.querySelectorAll('[data-handle]').forEach(function(h){
    h.addEventListener('pointerdown', function(e){
      e.preventDefault();
      var row = h.closest('.row');
      if(!row) return;
      row.classList.add('dragging');
      function onMove(ev){
        var rows = [].slice.call(box.querySelectorAll('.row'));
        var target = null;
        for(var i=0;i<rows.length;i++){
          var b = rows[i].getBoundingClientRect();
          if(ev.clientY < b.top + b.height/2){ target = rows[i]; break; }
        }
        if(target && target !== row) box.insertBefore(row, target);
        else if(!target) box.appendChild(row);
      }
      function onUp(){
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        row.classList.remove('dragging');
        var ids = [].slice.call(box.querySelectorAll('.row')).map(function(r){ return r.getAttribute('data-rid'); });
        ids.forEach(function(id, i){
          var c = recById(id);
          if(c){ c.sort = i; }
        });
        save();
        renderDetail();
      }
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
    });
  });
}

/* ============ 弹层框架 ============ */
function openSheet(html){
  $('sheetBox').innerHTML = html;
  $('mask').classList.remove('hidden');
  $('sheetBox').parentNode.scrollTop = 0;
}
function closeSheet(){ $('mask').classList.add('hidden'); }
$('mask').addEventListener('click', function(e){ if(e.target === $('mask')) closeSheet(); });

function wireStars(initial){
  var val = clampStars(initial);
  var box = $('sheetBox').querySelector('.staredit');
  if(!box) return { get:function(){ return val; } };
  var btns = box.querySelectorAll('button');
  function paint(){
    btns.forEach(function(b){ b.classList.toggle('on', parseInt(b.getAttribute('data-s'),10) <= val); });
  }
  btns.forEach(function(b){
    b.onclick = function(){ val = parseInt(b.getAttribute('data-s'),10); paint(); };
  });
  paint();
  return { get:function(){ return val; } };
}
function starsEditHTML(){
  var h = '<div class="staredit">';
  for(var i=1;i<=5;i++) h += '<button type="button" data-s="'+i+'">★</button>';
  return h + '</div>';
}
function wireChips(containerId, initial){
  var val = initial;
  var box = $(containerId);
  function paint(){
    box.querySelectorAll('.chip').forEach(function(c){ c.classList.toggle('on', c.getAttribute('data-v')===val); });
  }
  box.querySelectorAll('.chip').forEach(function(c){
    c.onclick = function(){ val = c.getAttribute('data-v'); paint(); if(box.__onPick) box.__onPick(val); };
  });
  paint();
  return { get:function(){ return val; } };
}
function wireToggle(elId, initial){
  var on = !!initial;
  var el = $(elId);
  function paint(){ el.classList.toggle('on', on); }
  el.onclick = function(){ on = !on; paint(); };
  paint();
  return { get:function(){ return on; } };
}

/* ============ 完成状态切换 ============ */
function toggleLink(t, clientId){
  if(!t) return;
  var l = (t.links||[]).filter(function(l){ return l.clientId===clientId; })[0];
  if(!l) return;
  l.done = !l.done;
  l.doneAt = l.done ? Date.now() : null;
  t.doneAt = taskDone(t) ? Date.now() : null;
  save(); render();
}
function toggleTaskDone(t){
  if(!t) return;
  var now = Date.now();
  if(taskDone(t)){
    activeLinks(t).forEach(function(l){ l.done=false; l.doneAt=null; });
    t.doneAt = null;
  }else{
    activeLinks(t).forEach(function(l){ l.done=true; l.doneAt=now; });
    t.doneAt = now;
  }
  save(); render();
}

    + '<div class="sheet-actions">'
    +   (c ? '<button class="btn danger" id="eDelete">删除</button>' : '')
    +   '<button class="btn ghost" id="eCancel">取消</button>'
    +   '<button class="btn primary" id="eSave">'+(c?'保存':'创建')+'</button>'
    + '</div>'
  );
  var tier = wireChips('eTier', c ? c.tier : 't1000');
  var chan = wireChips('eChannel', c ? c.channel : 'fd');
  var stars = wireStars(c ? c.stars : 3);
  /* 层级变了，而用户没手填过目标 → 用新层级的默认值刷新提示 */
  var quotaTouched = false;
  $('eQuota').addEventListener('input', function(){ quotaTouched = true; });
  $('eTier').__onPick = function(k){
    if(!quotaTouched && !c) $('eQuota').value = VISIT_QUOTA[k] != null ? VISIT_QUOTA[k] : '';
    $('eQuota').placeholder = '默认 '+(VISIT_QUOTA[k] != null ? VISIT_QUOTA[k] : 1)+' 次';
  };
  $('eCancel').onclick = closeSheet;
  $('eSave').onclick = function(){
    var name = $('eName').value.trim();
    if(!name){ $('eName').focus(); return; }
    var qv = $('eQuota').value.trim();
    var target = c;
    if(!target){
      target = {
        id: uid(), name: name, tier: tier.get(), channel: chan.get(),
        stars: stars.get(), note: $('eNote').value.trim(),
        createdAt: Date.now(), deleted: false
      };
      db.clients.push(target);
    }
    target.name = name; target.tier = tier.get(); target.channel = chan.get();
    target.stars = stars.get(); target.note = $('eNote').value.trim();
    if(qv === '') delete db.visitGoals[target.id];
    else db.visitGoals[target.id] = Math.max(0, parseInt(qv,10)||0);
    save(); closeSheet(); render();
  };
  if(c) $('eDelete').onclick = function(){
    c.deleted = true;
    save(); closeSheet(); render();
    showToast('已删除「'+c.name+'」', '撤销', function(){ c.deleted = false; save(); render(); });
  };
}

    + '<div class="field"><label>任务名称</label><input type="text" id="eName" maxlength="60" placeholder="例如：完成Q4进货政策宣导" value="'+esc(t?t.name:'')+'"></div>'
    + '<div class="field"><label>重要性（星级）</label>'+starsEditHTML()+'</div>'
    + '<div class="field"><label>截止日期（可精确到分钟，留空则不限）</label>'
    +   '<input type="datetime-local" id="eDue" value="'+(t&&t.dueAt?toLocalInput(t.dueAt):'')+'"></div>'
    + '<div class="field">'
    +   '<div class="pick-head"><label>关联客户（<span id="pickCount">0</span> 已选）</label>'
    +   '<button class="mini" id="pickAll">全选</button><button class="mini" id="pickNone">清空</button></div>'
    +   '<div class="picklist" id="pickList"></div>'
    + '</div>'
    + '<div class="sheet-actions">'
    +   (t ? '<button class="btn danger" id="eDelete">删除</button>' : '')
    +   '<button class="btn ghost" id="eCancel">取消</button>'
    +   '<button class="btn primary" id="eSave">'+(t?'保存':'创建')+'</button>'
    + '</div>'
  );
  var stars = wireStars(t ? t.stars : 3);

  function renderPick(){
    var list = sortedClients();
    var box = $('pickList');
    if(!list.length){
      box.innerHTML = '<div class="empty" style="padding:22px">客户集还是空的<br>先在「客户」页创建客户</div>';
    }else{
      box.innerHTML = list.map(function(c){
        return '<div class="prow" data-cid="'+c.id+'">'
          + '<button class="check'+(pickSet[c.id]?' on':'')+'"></button>'
          + '<span class="pnm">'+esc(c.name)+'</span>'
          + badgeHTML(c.tier)
          + '<span class="stars">'+starsText(c.stars)+'</span>'
          + '</div>';
      }).join('');
      box.querySelectorAll('.prow').forEach(function(r){
        r.onclick = function(){
          var cid = r.getAttribute('data-cid');
          if(pickSet[cid]) delete pickSet[cid]; else pickSet[cid] = 1;
          renderPick();
        };
      });
    }
    $('pickCount').textContent = Object.keys(pickSet).length;
  }
  renderPick();
  $('pickAll').onclick = function(){ sortedClients().forEach(function(c){ pickSet[c.id]=1; }); renderPick(); };
  $('pickNone').onclick = function(){ pickSet = {}; renderPick(); };

  $('eCancel').onclick = closeSheet;
  $('eSave').onclick = function(){
    var name = $('eName').value.trim();
    if(!name){ $('eName').focus(); return; }
    var dueV = $('eDue').value;
    var dueAt = dueV ? new Date(dueV).getTime() : null;
    if(isNaN(dueAt)) dueAt = null;
    if(t){
      t.name = name; t.stars = stars.get(); t.dueAt = dueAt;
      var keep = {};
      t.links = (t.links||[]).filter(function(l){
        if(pickSet[l.clientId]){ keep[l.clientId]=1; return true; }
        return false;
      });
      Object.keys(pickSet).forEach(function(cid){
        if(!keep[cid]) t.links.push({ clientId:cid, done:false, doneAt:null });
      });
      t.doneAt = taskDone(t) ? (t.doneAt||Date.now()) : null;
    }else{
      db.tasks.push({
        id: uid(), name: name, stars: stars.get(), dueAt: dueAt,
        createdAt: Date.now(), doneAt: null, deleted: false,
        links: Object.keys(pickSet).map(function(cid){
          return { clientId:cid, done:false, doneAt:null };
        })
      });
    }
    save(); closeSheet(); render();
  };
  if(t) $('eDelete').onclick = function(){
    t.deleted = true;
    save(); closeSheet(); render();
    showToast('已删除「'+t.name+'」', '撤销', function(){ t.deleted = false; save(); render(); });
  };
}

/* ============ 客户详情：关联已有任务 ============ */
function openLinkPicker(clientId){
  var c = clientById(clientId);
  if(!c) return;
  var cands = activeTasks().filter(function(t){
    return !activeLinks(t).some(function(l){ return l.clientId===clientId; });
  }).sort(function(a,b){ return (a.dueAt||INF)-(b.dueAt||INF) || b.stars-a.stars; });

  openSheet('<h2>给「'+esc(c.name)+'」关联任务</h2><div id="linkBox"></div>');
  var box = $('linkBox');
  if(!cands.length){
    box.innerHTML = '<div class="empty" style="padding:24px">没有可关联的任务<br>先在「周度」页创建任务</div>'
      + '<div class="sheet-actions"><button class="btn ghost" id="lkClose">关闭</button></div>';
    $('lkClose').onclick = closeSheet;
    return;
  }
  box.innerHTML = '<div class="picklist" style="max-height:50vh">' + cands.map(function(t){
    var st = taskLinkStats(t);
    return '<div class="prow" data-tid="'+t.id+'">'
      + '<span class="pnm">'+esc(t.name)+'</span>'
      + '<span class="stars">'+starsText(t.stars)+'</span>'

      + '</div>';

  + '<div class="sheet-actions"><button class="btn ghost" id="lkClose">关闭</button></div>';

    r.onclick = function(){

      }
      closeSheet(); render();
    };
  });
}

/* ============ 周历 / 月历 ============ */
function openWeekPicker(){
  var keys = weekList(4, 1);
  var html = '<h2>周历</h2><div class="picklist" style="max-height:52vh">';
  keys.slice().reverse().forEach(function(k){
    var r = weekRange(k);
    var isCur = k === curWeekKey();
    var isPast = r.start < mondayOf(Date.now());
    var tl = tasksOfWeek(k, false);
    var dn = tl.filter(taskDone).length;
    html += '<div class="prow" data-wk="'+k+'">'
      + '<span class="pnm">'+weekLabel(k)+'</span>'
      + '<span style="font-size:10.5px;color:var(--muted)">'+(isCur?'本周':(isPast?'历史':'未来'))+'</span>'
      + '<span class="badge" style="color:var(--accent);background:rgba(94,92,230,.18)">'+dn+'/'+tl.length+'</span>'
      + '</div>';
  });
  html += '</div><div class="hint" style="margin-top:10px">历史周可查看、可修改补录（规划 / 完成两栏）；下一周可以提前规划。没有记录的周不会显示其他周创建的数据。</div>'
    + '<div class="sheet-actions"><button class="btn ghost" id="wpCur">回到本周</button><button class="btn primary" id="wpClose">关闭</button></div>';
  openSheet(html);
  $('wpClose').onclick = closeSheet;
  $('wpCur').onclick = function(){ viewWeek = null; closeSheet(); renderWeek(); updateTopbar(); };
  $('sheetBox').querySelectorAll('.prow').forEach(function(r){
    r.onclick = function(){
      var k = r.getAttribute('data-wk');
      viewWeek = (k === curWeekKey()) ? null : k;
      weekSeg = 0;
      closeSheet(); renderWeek(); updateTopbar();
    };
  });
}
function openMonthPicker(){
  var base = new Date();
  var keys = [];
  for(var i = 0; i < 6; i++){
    var d = new Date(base.getFullYear(), base.getMonth()-i, 1);
    keys.push(monthKey(d.getTime()));
  }
  var html = '<h2>月历</h2><div class="picklist" style="max-height:52vh">';
  keys.forEach(function(k){
    var vs = db.visits.filter(function(v){ return inMonth(v.at, k); }).length;
    var col = recCollectTotal(k);
    var isCur = k === curMonthKey();
    html += '<div class="prow" data-mk="'+k+'">'
      + '<span class="pnm">'+monthLabel(k)+'</span>'
      + (isCur ? '<span style="font-size:10.5px;color:var(--accent);font-weight:600">本月</span>' : '')
      + '<span style="font-size:10.5px;color:var(--muted)">拜访 '+vs+' · 回收 '+col+'</span>'
      + '</div>';
  });
  html += '</div><div class="hint" style="margin-top:10px">业务数据按月留存。历史月份也能修改补录——新增记录时记得把<b>时间改成对应月份</b>，否则会算进本月。</div>'
    + '<div class="sheet-actions"><button class="btn ghost" id="mpCur">回到本月</button><button class="btn primary" id="mpClose">关闭</button></div>';
  openSheet(html);
  $('mpClose').onclick = closeSheet;
  $('mpCur').onclick = function(){ viewMonth = null; closeSheet(); renderDetail(); render(); };
  $('sheetBox').querySelectorAll('.prow').forEach(function(r){
    r.onclick = function(){
      var k = r.getAttribute('data-mk');
      viewMonth = (k === curMonthKey()) ? null : k;
      closeSheet(); renderDetail(); render();
    };
  });
}

function openSnapSheet(){
  var list = readSnapshots();
  if(!list.length){
    openSheet('<h2>自动快照</h2><div class="empty" style="padding:26px">还没有快照<br>每天首次打开会自动留一份</div>'
      + '<div class="sheet-actions"><button class="btn ghost" id="snClose">关闭</button></div>');
    $('snClose').onclick = closeSheet;
    return;
  }
  var html = '<h2>从自动快照恢复</h2>';
  list.slice().reverse().forEach(function(s){
    var idx = list.indexOf(s);
    var p = s.payload || {};
    var bizN = ((p.gov&&p.gov.customers||[]).length) + ((p.emergent&&p.emergent.customers||[]).length)
      + ((p.recycle&&p.recycle.customers||[]).length);
    html += '<div class="snap"><div class="t">'+fmtDateTime(s.at)+'</div>'
      + '<div class="d">客户 '+((s.clients||[]).length)+' · 任务 '+((s.tasks||[]).length)+' · 业务客户 '+bizN+'</div>'
      + '<button data-i="'+idx+'">恢复这份（当前数据会先存为快照）</button></div>';
  });
  html += '<div class="sheet-actions"><button class="btn ghost" id="snClose">关闭</button></div>';
  openSheet(html);
  $('snClose').onclick = closeSheet;
  $('sheetBox').querySelectorAll('.snap button').forEach(function(b){
    b.onclick = function(){
      var s = readSnapshots()[parseInt(b.getAttribute('data-i'),10)];
      if(!s) return;
      pushSnapshot();
      applyBackup(s);
      closeSheet(); render();
      showToast('已恢复快照', null, null);
    };
  });
}
/* 把一份备份（快照或导入文件）装进 db */
function applyBackup(src){
  var p = src.payload || src;
  db.version = DB_VERSION;
  db.clients = src.clients || [];
  db.tasks = src.tasks || [];
  db.visitGoals = (p.visitGoals && typeof p.visitGoals==='object') ? p.visitGoals : {};
  db.visits = p.visits || [];
  db.gov = p.gov || { customers:[], visits:[], orders:[] };
  db.emergent = p.emergent || { customers:[], visits:[], orders:[] };
  db.recycle = p.recycle || { customers:[], records:[] };
  db.weeks = p.weeks || {};
  normalizeAllIds();
}
$('fileInput').addEventListener('change', function(e){
  var f = e.target.files[0];
  e.target.value = '';
  if(!f) return;
  var r = new FileReader();
  r.onload = function(){
    try{
      var nd = normalizeImport(JSON.parse(r.result));
      pushSnapshot();
      db = nd;
      normalizeAllIds();
      save(); closeSheet(); render();
      showToast('导入成功（导入前的数据已存为快照）', null, null);
    }catch(err){
      showToast('导入失败：'+err.message, null, null);
    }
  };
  r.readAsText(f);
});

/* ============ Toast ============ */
function showToast(msg, actionLabel, onAction){
  var t = $('toast');
  t.querySelector('.msg').textContent = msg;
  var btn = $('toastBtn');
  if(actionLabel){
    btn.textContent = actionLabel;
    btn.classList.remove('hidden');
    btn.onclick = function(){ hideToast(); if(onAction) onAction(); };
  }else{
    btn.classList.add('hidden');
  }
  t.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, 6000);
}
function hideToast(){ $('toast').classList.add('hidden'); clearTimeout(toastTimer); }

/* ============ 标签页 / 顶栏 ============ */
function switchTab(tab){
  curTab = tab;
  $('pageWeek').classList.toggle('hidden', tab!=='week');
  $('pageBiz').classList.toggle('hidden', tab!=='biz');
  $('pageClients').classList.toggle('hidden', tab!=='clients');
  $('tabWeek').classList.toggle('on', tab==='week');
  $('tabBiz').classList.toggle('on', tab==='biz');
  $('tabClients').classList.toggle('on', tab==='clients');
  $('pageTitle').textContent = tab==='week' ? '周度' : (tab==='biz' ? '业务' : '客户');
  updateTopbar();
  render();
}
function updateTopbar(){
  var cal = $('btnCal'), add = $('btnAdd');
  if(curTab === 'week'){
    cal.classList.remove('hidden');
    add.classList.remove('hidden');   // 历史/未来周都可以添加（历史周可补录）
  }else if(curTab === 'biz'){
    cal.classList.remove('hidden');
    add.classList.add('hidden');
  }else{
    cal.classList.add('hidden');
    add.classList.remove('hidden');
  }
}
$('tabWeek').onclick = function(){ switchTab('week'); };
$('tabBiz').onclick = function(){ switchTab('biz'); };
$('tabClients').onclick = function(){ switchTab('clients'); };
$('btnAdd').onclick = function(){
  if(curTab === 'clients') openClientEditor(null);
  else if(curTab === 'week') openWeekAddSheet();
};
$('btnCal').onclick = function(){
  if(curTab === 'week') openWeekPicker();
  else if(curTab === 'biz') openMonthPicker();
};
$('btnMenu').onclick = openMenu;
$('btnBack').onclick = function(){ closeDetail(); };
$('fabBack').onclick = function(){ closeDetail(); };

/* ============ 启动 ============ */
function setAppHeight(){
  document.documentElement.style.setProperty('--app-h', window.innerHeight + 'px');
}
window.addEventListener('resize', setAppHeight);

load();
/* 顺序不能反：老数据（v1）没有 gov/emergent/weeks 等新结构，
   必须先 migrate 补齐结构，normalizeAllIds 才不会在 undefined 上崩溃。
   一旦顺序反了，启动即抛异常，后面所有事件绑定都不执行 —— 整个应用点不动。 */
migrate();
normalizeAllIds();
save();
snapshot();
setAppHeight();
switchTab('week');

document.addEventListener('visibilitychange', function(){ if(!document.hidden) render(); });
setInterval(function(){
  /* 跨周 / 跨月时自动回到当期，避免一直停在上一周 */
  if(!viewWeek) updateTopbar();
  render();
}, 60000);

if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).catch(function(){});
  });
}
